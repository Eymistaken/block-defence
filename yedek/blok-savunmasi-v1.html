<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Blok Savunması</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--dirt:none;--stone:none;--s:52px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#120d09;color:#fff;font-family:'VT323',monospace;font-size:20px;user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
body.menu #topbar,body.menu #bottombar,body.menu #xpwrap{display:none}

/* ---------- top bar ---------- */
#topbar{height:46px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.65)),var(--stone);background-size:auto,48px 48px;border-bottom:3px solid #000;image-rendering:pixelated;z-index:5}
.stat{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;background:rgba(0,0,0,.55);border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.12);font-size:24px;text-shadow:2px 2px 0 #000;white-space:nowrap}
.stat canvas{width:22px;height:22px;image-rendering:pixelated}
#stMoney{color:#7dff8f;min-width:52px}
#stHearts span{color:#ff6b6b}
#stWave{color:#ffe28a}
#stTime{color:#bcd3ff}
#stMap{color:#ddd;font-size:20px}
.grow{flex:1}
.mc-btn{font-size:22px;color:#fff;text-shadow:2px 2px 0 #3f3f3f;background:#6e6e6e;border:3px solid #000;box-shadow:inset 3px 3px 0 #a9a9a9,inset -3px -3px 0 #484848;padding:5px 16px;cursor:pointer;min-width:44px;line-height:1.05;position:relative}
.mc-btn:hover:not(:disabled){background:#7b86c6;box-shadow:inset 3px 3px 0 #b8c2ff,inset -3px -3px 0 #4b5494}
.mc-btn:active:not(:disabled){transform:translateY(1px)}
.mc-btn:disabled{background:#3a3a3a;color:#8a8a8a;box-shadow:inset 3px 3px 0 #4a4a4a,inset -3px -3px 0 #2a2a2a;cursor:not-allowed;text-shadow:none}
.mc-btn.sm{font-size:20px;padding:3px 10px;height:34px}
.mc-btn.green{background:#3d8a3d;box-shadow:inset 3px 3px 0 #6cc06c,inset -3px -3px 0 #245a24}
.mc-btn.green:hover:not(:disabled){background:#4aa34a;box-shadow:inset 3px 3px 0 #8fe08f,inset -3px -3px 0 #2a6a2a}
.mc-btn.red{background:#8a3333;box-shadow:inset 3px 3px 0 #c06060,inset -3px -3px 0 #551f1f}
.mc-btn.red:hover:not(:disabled){background:#a43c3c;box-shadow:inset 3px 3px 0 #e08080,inset -3px -3px 0 #662424}
.mc-btn.on{background:#4a6aa8;box-shadow:inset 3px 3px 0 #8aa8e8,inset -3px -3px 0 #2a4070}
.mc-btn.wide{min-width:300px;font-size:24px;padding:8px 16px}

/* ---------- stage ---------- */
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:default;box-shadow:0 0 0 3px #000,0 0 40px rgba(0,0,0,.8)}
#bossbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:min(520px,60%);display:none;flex-direction:column;align-items:center;pointer-events:none;z-index:6}
#bossbar .name{font-size:22px;text-shadow:2px 2px 0 #000;color:#fff;margin-bottom:2px}
#bossbar .bar{width:100%;height:12px;background:#2a0a2a;border:2px solid #000;box-shadow:0 0 0 1px #6a2a6a}
#bossbar .fill{height:100%;width:100%;background:linear-gradient(#ff5af0,#b01aa8);transition:width .15s}
#banner{position:absolute;top:24%;left:0;right:0;text-align:center;font-family:'Press Start 2P',monospace;font-size:clamp(16px,2.6vw,30px);line-height:1.5;color:#fff;text-shadow:3px 3px 0 #000,0 0 18px rgba(0,0,0,.8);pointer-events:none;opacity:0;z-index:7}
#banner small{display:block;font-family:'VT323',monospace;font-size:clamp(18px,2vw,26px);color:#ffe28a}
#banner.show{animation:bannerAnim 2.8s ease forwards}
@keyframes bannerAnim{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(16,0,16,.9);border:2px solid #2a0a5a;box-shadow:0 0 0 2px #000;color:#ffff6a;padding:6px 14px;font-size:22px;display:none;z-index:8;pointer-events:none;text-align:center;max-width:90%}
#hint.show{display:block;animation:hintPulse 1.4s infinite}
@keyframes hintPulse{50%{box-shadow:0 0 0 2px #000,0 0 18px rgba(255,255,100,.5)}}

/* tower panel */
.mc-panel{background:#c6c6c6;color:#3f3f3f;border:3px solid #000;box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #555;padding:10px}
#towerPanel{position:absolute;top:10px;width:270px;display:none;z-index:9;font-size:19px}
#towerPanel .hd{display:flex;gap:8px;align-items:center;margin-bottom:6px}
#towerPanel .hd canvas{width:46px;height:46px;image-rendering:pixelated;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737}
#towerPanel .nm{font-size:23px;color:#202020;line-height:1}
#towerPanel .lv{color:#555;font-size:18px}
.pips{display:flex;gap:3px;margin-top:3px}
.pips i{width:12px;height:12px;background:#777;border:2px solid #444;display:block}
.pips i.on{background:#ffd83d;border-color:#8a6a00}
.srow{display:flex;justify-content:space-between;padding:1px 2px;border-bottom:1px dotted #9a9a9a}
.srow b{color:#222;font-weight:normal}
.srow .up{color:#1a8a1a}
.ptitle{color:#5a2a8a;margin-top:4px}
.tbtns{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.tbtns .mc-btn{font-size:20px;padding:4px 8px;width:100%}
.tmode{display:flex;gap:4px;align-items:center;justify-content:space-between;margin-top:6px}
.tmode .mc-btn{font-size:18px;padding:2px 8px;flex:1}
.close-x{position:absolute;top:4px;right:6px;cursor:pointer;color:#555;font-size:22px}
.close-x:hover{color:#000}

/* tooltip */
.tip{position:fixed;background:rgba(16,0,16,.94);border:2px solid #2c0a63;box-shadow:0 0 0 2px #100010;color:#fff;padding:6px 9px;font-size:19px;pointer-events:none;z-index:200;max-width:330px;display:none;line-height:1.1}
.tip .t{color:#fff;font-size:21px}
.g{color:#55ff55}.r{color:#ff5555}.y{color:#ffff55}.b{color:#55ffff}.gr{color:#aaaaaa}.p{color:#ff77ff}.o{color:#ffaa00}

/* toasts */
#toasts{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none}
.toast{width:290px;background:#212121;border:3px solid #000;box-shadow:inset 2px 2px 0 #555,inset -2px -2px 0 #0a0a0a;display:flex;gap:10px;padding:7px 8px;align-items:center;animation:toastIn .45s ease,toastOut .5s ease 4.5s forwards}
.toast canvas{width:34px;height:34px;image-rendering:pixelated;flex:none}
.toast .t1{color:#ffff55;font-size:19px;line-height:1}
.toast .t2{color:#fff;font-size:19px;line-height:1.05}
.toast.lvl .t1{color:#7dff8f}
@keyframes toastIn{from{transform:translateX(330px)}to{transform:none}}
@keyframes toastOut{to{transform:translateX(330px);opacity:0}}

/* ---------- xp + bottom ---------- */
#xpwrap{height:16px;flex:none;position:relative;background:#000;display:flex;justify-content:center;align-items:center}
#xpbar{width:min(560px,70%);height:10px;background:#1a1a1a;border:2px solid #000;box-shadow:0 0 0 1px #3a3a3a}
#xpfill{height:100%;width:0;background:linear-gradient(#b8ff5a,#5fc41a);transition:width .3s}
#xplvl{position:absolute;left:50%;top:-14px;transform:translateX(-50%);color:#80ff20;font-size:24px;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000;z-index:2;pointer-events:none}
#bottombar{height:86px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 10px;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.6)),var(--stone);background-size:auto,48px 48px;border-top:3px solid #000;image-rendering:pixelated}
#abilities{display:flex;gap:6px}
.abil{width:56px;height:56px;position:relative;background:#3a3a3a;border:3px solid #000;box-shadow:inset 2px 2px 0 #777,inset -2px -2px 0 #222;cursor:pointer;overflow:hidden}
.abil canvas.ic{position:absolute;left:5px;top:5px;width:40px;height:40px;image-rendering:pixelated}
.abil .cdov{position:absolute;inset:0;background:rgba(0,0,0,.65);pointer-events:none}
.abil .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;text-shadow:2px 2px 0 #000;pointer-events:none}
.abil .key{position:absolute;left:3px;top:-1px;font-size:16px;color:#ffffa0;text-shadow:1px 1px 0 #000;pointer-events:none}
.abil.ready{box-shadow:inset 2px 2px 0 #9a9,inset -2px -2px 0 #232,0 0 10px rgba(120,255,120,.4)}
.abil.aim{outline:3px solid #ffd83d}
#hotbar{display:flex;background:#000;padding:2px;border:2px solid #000;box-shadow:0 0 0 2px #5a5a5a}
.slot{width:var(--s);height:var(--s);position:relative;background:#8b8b8b;border:3px solid;border-color:#373737 #fff #fff #373737;cursor:pointer;flex:none}
.slot canvas{position:absolute;left:1px;top:0;width:calc(var(--s) - 8px);height:calc(var(--s) - 8px);image-rendering:pixelated}
.slot .cost{position:absolute;right:1px;bottom:-3px;font-size:18px;color:#fff;text-shadow:2px 2px 0 #3f3f3f}
.slot .key{position:absolute;left:2px;top:-3px;font-size:15px;color:#ffffa0;text-shadow:1px 1px 0 #000}
.slot.sel{outline:4px solid #fff;outline-offset:-2px;z-index:2;box-shadow:0 0 0 3px #000}
.slot.poor .cost{color:#ff5555}
.slot.locked canvas{filter:brightness(0)}
.slot.locked{background:#555}
.slot.locked .cost{display:none}
#wavebox{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:220px}
#btnWave{font-size:21px;padding:5px 12px;min-width:220px}
#btnWave .bonus{color:#7dff8f}
#wavePreview{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:300px}
#wavePreview .wp{display:flex;align-items:center;background:rgba(0,0,0,.6);border:1px solid #000;padding:0 3px 0 0;font-size:17px}
#wavePreview canvas{width:22px;height:22px;image-rendering:pixelated}
@media (max-width:1100px){:root{--s:44px}#wavebox{min-width:160px}#btnWave{min-width:160px;font-size:18px}.abil{width:46px;height:46px}.abil canvas.ic{width:32px;height:32px;left:4px;top:4px}}
@media (max-width:820px){#bottombar{height:auto;flex-wrap:wrap;justify-content:center;padding:4px}:root{--s:38px}#stMap,#stTime{display:none}.slot .cost{font-size:15px}}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:16px;overflow:auto}
.screen.show{display:flex}
.screen.dirt{background:linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.62)),var(--dirt);background-size:auto,64px 64px;image-rendering:pixelated}
.screen.dim{background:rgba(0,0,0,.6)}
.screen h2{font-family:'Press Start 2P',monospace;font-size:clamp(16px,2.4vw,26px);color:#fff;text-shadow:3px 3px 0 #3f3f3f;margin-bottom:16px;text-align:center}
.col{display:flex;flex-direction:column;gap:8px;align-items:center}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
#scrMenu{background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.75))}
.logo{position:relative;margin-bottom:34px;text-align:center}
.logo h1{font-family:'Press Start 2P',monospace;font-size:clamp(26px,5.6vw,66px);color:#d9d9d9;letter-spacing:2px;filter:drop-shadow(0 5px 0 #5a5a5a) drop-shadow(0 4px 0 #2a2a2a) drop-shadow(0 8px 12px rgba(0,0,0,.7));line-height:1.15}
.logo h1 span{color:#7dd65a}
.logo .sub{font-family:'Press Start 2P',monospace;font-size:clamp(9px,1.2vw,14px);color:#bbb;margin-top:10px;text-shadow:2px 2px 0 #000;letter-spacing:4px}
.splash{position:absolute;right:-4%;bottom:-6px;color:#ffff3a;font-size:clamp(18px,2.2vw,28px);text-shadow:2px 2px 0 #3f3f00;transform:rotate(-14deg);animation:splash .5s ease-in-out infinite alternate;white-space:nowrap;pointer-events:none}
@keyframes splash{to{transform:rotate(-14deg) scale(1.09)}}
.foot{position:absolute;bottom:6px;left:10px;right:10px;display:flex;justify-content:space-between;font-size:18px;color:#ddd;text-shadow:2px 2px 0 #000}
.menu-btns .mc-btn{width:min(400px,80vw)}
.menu-btns .half{display:flex;gap:8px;width:min(400px,80vw)}
.menu-btns .half .mc-btn{flex:1;width:auto;min-width:0}

#levelGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;width:min(1000px,96vw);margin-bottom:14px}
.card{background:#1d1d1d;border:3px solid #000;box-shadow:inset 2px 2px 0 #4a4a4a,inset -2px -2px 0 #0a0a0a;padding:7px;cursor:pointer;position:relative}
.card:hover{box-shadow:inset 2px 2px 0 #8a8ac0,inset -2px -2px 0 #0a0a0a}
.card.sel{outline:3px solid #fff;box-shadow:0 0 0 3px #000,0 0 16px rgba(255,255,255,.25)}
.card canvas{width:100%;aspect-ratio:5/3;image-rendering:pixelated;display:block;border:2px solid #000}
.card .cn{font-size:22px;margin-top:4px;color:#fff}
.card .cd{font-size:17px;color:#aaa;line-height:1}
.card .st{color:#555;font-size:22px;letter-spacing:2px}
.card .st .on{color:#ffd83d;text-shadow:0 0 6px rgba(255,216,61,.6)}
.card.locked{cursor:not-allowed}
.card.locked canvas{filter:grayscale(1) brightness(.35)}
.card .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:#ddd;text-align:center;padding:20px;text-shadow:2px 2px 0 #000;pointer-events:none}
.optlbl{font-size:20px;color:#ddd;margin-right:4px}
.diffdesc{font-size:18px;color:#bbb;min-height:22px;margin-top:6px;text-align:center}

#perkGrid,#achGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;width:min(1000px,96vw);margin-bottom:14px}
.perk,.ach{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.55);border:2px solid #000;box-shadow:inset 2px 2px 0 #3a3a3a;padding:8px}
.perk canvas,.ach canvas{width:40px;height:40px;image-rendering:pixelated;flex:none}
.perk .info,.ach .info{flex:1}
.perk .pn,.ach .an{font-size:22px;color:#ffff6a;line-height:1}
.perk .pd,.ach .ad{font-size:18px;color:#ccc;line-height:1.05}
.ranks{display:flex;gap:3px;margin-top:3px}
.ranks i{width:14px;height:8px;background:#333;border:1px solid #000;display:block}
.ranks i.on{background:#b46cff;box-shadow:0 0 5px #b46cff}
.perk .mc-btn{font-size:22px;padding:2px 10px;min-width:40px}
.ach.lock{opacity:.45}
.ach.lock canvas{filter:grayscale(1) brightness(.5)}
.ptsinfo{font-size:24px;color:#7dff8f;margin-bottom:10px;text-shadow:2px 2px 0 #000;text-align:center}

#bookTabs{margin-bottom:10px}
#bookBody{width:min(1000px,96vw);max-height:62vh;overflow:auto;background:rgba(0,0,0,.55);border:2px solid #000;padding:10px;margin-bottom:12px}
.entry{display:flex;gap:12px;padding:8px;border-bottom:2px solid rgba(255,255,255,.08)}
.entry canvas{width:56px;height:56px;image-rendering:pixelated;flex:none;background:rgba(255,255,255,.06);border:2px solid #000}
.entry .en{font-size:24px;color:#ffff6a}
.entry .ed{font-size:19px;color:#ddd;line-height:1.1}
.entry table{border-collapse:collapse;margin-top:4px;font-size:17px}
.entry td,.entry th{border:1px solid #444;padding:1px 6px;text-align:center}
.entry th{color:#aaa;font-weight:normal}
.tag{display:inline-block;background:#333;border:1px solid #000;padding:0 5px;margin:2px 3px 0 0;font-size:17px}
.help{font-size:21px;line-height:1.25;color:#e8e8e8}
.help h3{color:#ffff6a;font-weight:normal;font-size:24px;margin:8px 0 2px}
.help kbd{background:#444;border:2px solid #000;border-bottom-width:3px;padding:0 6px;font-family:inherit;color:#fff}

.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(640px,94vw);margin-bottom:14px}
.setgrid .mc-btn{width:100%;font-size:20px}
.slider{display:flex;flex-direction:column;background:#6e6e6e;border:3px solid #000;box-shadow:inset 3px 3px 0 #a9a9a9,inset -3px -3px 0 #484848;padding:4px 10px;text-shadow:2px 2px 0 #3f3f3f;font-size:20px;text-align:center}
.slider input{width:100%;accent-color:#c6c6c6}

#endBox{min-width:min(460px,92vw);text-align:center}
#endBox .bigstars{font-size:54px;color:#444;letter-spacing:6px;margin:4px 0}
#endBox .bigstars .on{color:#ffd83d;text-shadow:0 0 12px rgba(255,216,61,.8)}
.endstats{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;font-size:21px;margin:10px auto 16px;text-align:left;width:max-content}
.endstats span:nth-child(odd){color:#bbb}
.endstats span:nth-child(even){color:#fff;text-align:right}
</style>
</head>
<body class="menu">
<div id="app">
  <div id="topbar">
    <div class="stat" id="stHearts" title="Köy canı"><canvas id="icoHeart" width="9" height="8"></canvas><span id="stLives">20</span></div>
    <div class="stat" title="Zümrüt"><canvas id="icoEm" width="8" height="8"></canvas><span id="stMoney">0</span></div>
    <div class="stat"><span id="stWave">Dalga 0/15</span></div>
    <div class="stat"><span id="stTime">☀ Gündüz</span></div>
    <div class="stat"><span id="stMap">Harita</span></div>
    <div class="grow"></div>
    <button class="mc-btn sm" id="btnSpeed" title="Oyun hızı (F)">1x</button>
    <button class="mc-btn sm" id="btnPause" title="Duraklat (P / Esc)">❚❚</button>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="bossbar"><div class="name" id="bossName">Boss</div><div class="bar"><div class="fill" id="bossFill"></div></div></div>
    <div id="banner"></div>
    <div id="hint"></div>
    <div id="towerPanel" class="mc-panel"></div>
    <div id="toasts"></div>

    <!-- MENU -->
    <div class="screen show" id="scrMenu">
      <div class="logo"><h1>BLOK<br><span>SAVUNMASI</span></h1><div class="sub">KULE SAVUNMA</div><div class="splash" id="splash">Kaz, kur, koru!</div></div>
      <div class="col menu-btns">
        <button class="mc-btn wide" id="mPlay">Oyna</button>
        <div class="half"><button class="mc-btn wide" id="mPerks">Büyü Masası</button><button class="mc-btn wide" id="mAch">Başarımlar</button></div>
        <div class="half"><button class="mc-btn wide" id="mBook">Ansiklopedi</button><button class="mc-btn wide" id="mSettings">Ayarlar</button></div>
      </div>
      <div class="foot"><span id="footLvl">Seviye 0</span><span>Blok Savunması v1.0 · Tek dosya</span></div>
    </div>

    <!-- LEVEL SELECT -->
    <div class="screen dirt" id="scrLevels">
      <h2>Dünya Seç</h2>
      <div class="row" style="margin-bottom:10px"><span class="optlbl">Mod:</span><button class="mc-btn sm" data-mode="campaign">Macera</button><button class="mc-btn sm" data-mode="endless">Sonsuz</button></div>
      <div id="levelGrid"></div>
      <div class="row"><span class="optlbl">Zorluk:</span><button class="mc-btn sm" data-diff="easy">Kolay</button><button class="mc-btn sm" data-diff="normal">Normal</button><button class="mc-btn sm" data-diff="hard">Zor</button><button class="mc-btn sm" data-diff="creative">Yaratıcı</button></div>
      <div class="diffdesc" id="diffDesc"></div>
      <div class="row" style="margin-top:12px"><button class="mc-btn" id="lvBack">Geri</button><button class="mc-btn green" id="lvStart" style="min-width:220px">Dünyaya Gir</button></div>
    </div>

    <!-- PERKS -->
    <div class="screen dirt" id="scrPerks">
      <h2>Büyü Masası</h2>
      <div class="ptsinfo" id="perkPts"></div>
      <div id="perkGrid"></div>
      <div class="row"><button class="mc-btn" id="pkBack">Geri</button><button class="mc-btn red" id="pkReset">Puanları Sıfırla</button></div>
    </div>

    <!-- ACHIEVEMENTS -->
    <div class="screen dirt" id="scrAch">
      <h2>Başarımlar</h2>
      <div class="ptsinfo" id="achInfo"></div>
      <div id="achGrid"></div>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const AU={ctx:null,last:{}};
function initAudio(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  let c;try{c=AU.ctx=new AC()}catch(e){return}
  AU.master=c.createGain();AU.master.gain.value=.85;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-15;comp.knee.value=10;comp.ratio.value=5;comp.attack.value=.003;comp.release.value=.25;
  AU.master.connect(comp);comp.connect(c.destination);
  AU.sfx=c.createGain();AU.sfx.connect(AU.master);
  AU.mus=c.createGain();AU.mus.connect(AU.master);
  AU.musBus=c.createGain();AU.musBus.connect(AU.mus);
  const dl=c.createDelay(2);dl.delayTime.value=.43;const fb=c.createGain();fb.gain.value=.36;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1700;
  AU.musBus.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(AU.mus);
  const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=buf;
  applyVolumes();musicStart();
}
function applyVolumes(){if(!AU.ctx)return;AU.sfx.gain.value=SAVE.settings.sfx;AU.mus.gain.value=SAVE.settings.music*.55}
function tone(f,d,o={}){
  const c=AU.ctx;if(!c)return;const t=c.currentTime+(o.when||0);
  const osc=c.createOscillator();osc.type=o.type||'square';osc.frequency.setValueAtTime(f,t);
  if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+(o.slide||d));
  if(o.detune)osc.detune.value=o.detune;
  const g=c.createGain(),v=o.v==null?.15:o.v,a=o.a||.004;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);
  if(o.hold)g.gain.setValueAtTime(v,t+a+o.hold);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  let n=osc;
  if(o.lp||o.hp||o.bp){const fl=c.createBiquadFilter();fl.type=o.lp?'lowpass':o.hp?'highpass':'bandpass';fl.frequency.value=o.lp||o.hp||o.bp;if(o.q)fl.Q.value=o.q;osc.connect(fl);n=fl}
  n.connect(g);g.connect(o.dest||AU.sfx);
  if(o.vib){const l=c.createOscillator();l.frequency.value=o.vib;const lg=c.createGain();lg.gain.value=o.vibAmt||f*.05;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+d+.05)}
  osc.start(t);osc.stop(t+d+.05);
}
function noise(d,o={}){
  const c=AU.ctx;if(!c)return;const t=c.currentTime+(o.when||0);
  const s=c.createBufferSource();s.buffer=AU.noise;s.loop=true;
  const fl=c.createBiquadFilter();fl.type=o.type||'lowpass';fl.frequency.setValueAtTime(o.f||2000,t);
  if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t+d);fl.Q.value=o.q||1;
  const g=c.createGain(),v=o.v==null?.2:o.v,a=o.a||.003;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(o.dest||AU.sfx);s.start(t,Math.random()*1.5);s.stop(t+d+.05);
}

const SFX_GAP={arrow:.05,hit:.035,zombie:.5,zombieDie:.15,skeleton:.25,spider:.35,slime:.12,fire:.09,orb:.045,dig:.05,zap:.07,ice:.07,explosion:.09,smallBoom:.06,piston:.06,glass:.08,ballista:.08,leak:.1,bat:.3,witch:.6,ghost:.6,magma:.2,pop:.04,stun:.2,heal:.3,punch:.08};
let SFX_MUTED=false;
function sfx(name,force){
  if(!AU.ctx||SAVE.settings.sfx<=0)return;if(SFX_MUTED&&!force)return;
  const now=AU.ctx.currentTime,gap=SFX_GAP[name]??.03;
  if(AU.last[name]&&now-AU.last[name]<gap)return;AU.last[name]=now;
  try{SFX[name]()}catch(e){}
}

/* ---------- prosedürel müzik ---------- */
const MOODS={
  menu:{root:57,scale:[0,2,4,7,9],prog:[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]],beat:.6,dens:.42},
  plains:{root:60,scale:[0,2,4,6,7,9,11],prog:[[0,4,7,11],[5,9,12],[-3,0,4,7],[7,11,14]],beat:.52,dens:.46},
  desert:{root:52,scale:[0,1,4,5,7,8,10],prog:[[0,4,7],[1,5,8],[0,4,7],[-2,1,5]],beat:.46,dens:.42},
  tundra:{root:54,scale:[0,2,3,7,8],prog:[[0,3,7],[-4,0,3],[-2,2,5],[-5,-2,2]],beat:.62,dens:.36},
  cave:{root:45,scale:[0,1,3,7,8],prog:[[0,7],[1,8],[0,7],[-2,5]],beat:.8,dens:.26},
  nether:{root:43,scale:[0,1,3,6,7,10],prog:[[0,3,6],[1,4,7],[0,3,7],[-1,3,6]],beat:.5,dens:.32},
  void:{root:50,scale:[0,2,4,6,8,10],prog:[[0,4,8],[2,6,10],[-2,2,6],[0,4,8]],beat:.7,dens:.32},
};
const MUS={nextT:0,step:0,chord:0,mood:'menu',boss:false,timer:null};
const midi=m=>440*Math.pow(2,(m-69)/12);
function musicStart(){if(MUS.timer)return;MUS.nextT=AU.ctx.currentTime+.3;MUS.timer=setInterval(musicTick,110)}
function setMood(m){if(MUS.mood!==m){MUS.mood=m;MUS.step=0}}
function musicTick(){
  const c=AU.ctx;if(!c||c.state!=='running')return;
  if(SAVE.settings.music<=.001||document.hidden){MUS.nextT=c.currentTime+.2;return}
  const M=MOODS[MUS.mood]||MOODS.menu;
  if(MUS.nextT<c.currentTime)MUS.nextT=c.currentTime+.05;
  while(MUS.nextT<c.currentTime+.45){
    const when=MUS.nextT-c.currentTime,s=MUS.step;
    if(s%16===0){MUS.chord=(MUS.chord+1)%M.prog.length;const dur=M.beat*8;
      M.prog[MUS.chord].forEach(n=>tone(midi(M.root+n-12),dur*1.05,{type:'sine',v:.022,a:dur*.35,hold:dur*.3,when,dest:AU.musBus,detune:rand(-7,7)}));
      tone(midi(M.root+M.prog[MUS.chord][0]-24),dur,{type:'triangle',v:.03,a:.4,hold:dur*.4,when,dest:AU.musBus});
    }
    if((s%2===0&&Math.random()<M.dens)||Math.random()<M.dens*.18){
      const deg=M.scale[randi(0,M.scale.length-1)],oct=pick([12,12,24,0]),f=midi(M.root+deg+oct);
      tone(f,2.4,{type:'triangle',v:.045,a:.008,when,dest:AU.musBus,lp:2600});
      tone(f*2,1.1,{type:'sine',v:.012,a:.008,when,dest:AU.musBus});
    }
    if(MUS.boss&&s%2===0){tone(midi(M.root-12+M.prog[MUS.chord][0]),.25,{type:'sawtooth',v:.035,lp:380,when,dest:AU.musBus});if(s%8===4)noise(.08,{type:'lowpass',f:200,v:.12,when,dest:AU.musBus})}
    MUS.step++;MUS.nextT+=M.beat/2;
  }
}

const TX={};
function makeTex(seed,fn,w=16,h=16){const c=mkCanvas(w,h),g=c.getContext('2d');fn(g,mulberry32(seed),w,h);return c}
function speck(g,r,cols,pw=1.6){for(let y=0;y<16;y++)for(let x=0;x<16;x++){g.fillStyle=cols[Math.min(cols.length-1,Math.floor(Math.pow(r(),pw)*cols.length))];g.fillRect(x,y,1,1)}}
function blockTex(base,mid,hi,lo){return(g,r)=>{R(g,0,0,16,16,base);for(let i=0;i<40;i++){g.fillStyle=r()<.5?mid:base;g.fillRect(1+Math.floor(r()*14),1+Math.floor(r()*14),1,1)}
  R(g,0,0,16,1,hi);R(g,0,0,1,16,hi);R(g,0,15,16,1,lo);R(g,15,0,1,16,lo);R(g,2,2,4,1,hi);R(g,2,3,2,1,hi);R(g,11,13,3,1,lo);R(g,13,11,1,3,lo)}}
function cobbleTex(g,r){R(g,0,0,16,16,'#4f4f4f');const cols=['#8a8a8a','#7a7a7a','#9b9b9b','#6e6e6e','#838383'];
  for(let i=0;i<14;i++){const x=Math.floor(r()*16),y=Math.floor(r()*16),w=3+Math.floor(r()*4),h=2+Math.floor(r()*3),c=cols[Math.floor(r()*cols.length)];
    for(const ox of[0,-16])for(const oy of[0,-16]){R(g,x+ox,y+oy,w,h,c);R(g,x+ox,y+oy,w,1,'#a5a5a5');R(g,x+ox,y+oy+h-1,w,1,'#5c5c5c')}}}
function planksTex(g,r){const cols=['#a2834f','#9a7b48','#ad8c56','#a48650'];
  for(let b=0;b<4;b++){const base=cols[b];for(let y=0;y<4;y++)for(let x=0;x<16;x++){g.fillStyle=r()<.18?'#8f7142':(r()<.1?'#b8975f':base);g.fillRect(x,b*4+y,1,1)}
    R(g,0,b*4+3,16,1,'#6b5430');const sx=(b*5+3)%16;R(g,sx,b*4,1,3,'#6b5430')}}
function oreTex(baseCols,oreCols){return(g,r)=>{speck(g,r,baseCols);for(let k=0;k<5;k++){const cx=1+Math.floor(r()*12),cy=1+Math.floor(r()*12);
  for(let i=0;i<4;i++){const x=cx+Math.floor(r()*3),y=cy+Math.floor(r()*3);R(g,x,y,1,1,oreCols[0]);if(r()<.5)R(g,x+1,y,1,1,oreCols[1]||oreCols[0])}
  R(g,cx,cy,1,1,oreCols[2]||oreCols[0])}}}

function buildTextures(){
  const V=(name,n,fn)=>{TX[name]=[];for(let i=0;i<n;i++)TX[name].push(makeTex(hashStr(name)+i*977,typeof fn==='function'?fn:(g,r)=>speck(g,r,fn)))};
  V('grass',4,(g,r)=>{speck(g,r,['#5d9b3a','#538f33','#67a842','#4a822d','#76b84d']);for(let i=0;i<7;i++)R(g,Math.floor(r()*16),Math.floor(r()*16),1,1,'#86cf5a')});
  V('dirt',3,['#866043','#77553a','#96704d','#5f432c']);
  V('path',4,(g,r)=>{speck(g,r,['#a08458','#94784e','#ad9165','#86693f','#b89c6e']);for(let i=0;i<5;i++)R(g,Math.floor(r()*16),Math.floor(r()*16),1,1,r()<.5?'#7d7466':'#c9bc9f')});
  V('sand',3,['#dccf91','#d3c582','#e5d9a2','#c8b976']);
  V('sandpath',3,(g,r)=>{speck(g,r,['#c9a66b','#bd9a5f','#d4b27a','#b08a52']);for(let i=0;i<4;i++)R(g,Math.floor(r()*16),Math.floor(r()*16),1,1,'#9a7a4a')});
  V('snow',3,['#f3f7fa','#e8eff5','#ffffff','#dbe5ee']);
  V('snowpath',3,['#b5c2cd','#a7b5c2','#c4cfd9','#96a4b1','#d4dde5']);
  V('ice',2,(g,r)=>{speck(g,r,['#9fc6f2','#93bcee','#acd0f6'],1.2);g.fillStyle='rgba(255,255,255,.6)';for(let i=0;i<3;i++){const x=Math.floor(r()*16),y=Math.floor(r()*16);for(let k=0;k<5;k++)g.fillRect((x+k)%16,(y+k)%16,1,1)}});
  V('stone',3,STONE);
  V('cobble',2,cobbleTex);
  V('deep',3,['#4b4b52','#43434a','#55555b','#3b3b41']);
  V('gravel',3,(g,r)=>speck(g,r,['#857f7c','#6f6a68','#9a9390','#5e5856','#a8a19c'],1));
  V('netherrack',3,NRACK);
  V('blackstone',3,['#2b2529','#342e33','#231e22','#3d363c','#48404a']);
  V('soul',3,['#4f3d30','#5a4637','#46362b','#3c2e25']);
  V('endstone',3,(g,r)=>{speck(g,r,ESTONE);for(let i=0;i<6;i++)R(g,Math.floor(r()*16),Math.floor(r()*16),1,1,'#b6ba7a')});
  V('obsidian',2,(g,r)=>{speck(g,r,['#15101f','#1d1530','#100b18','#2a1d45'],1.3);for(let i=0;i<4;i++)R(g,Math.floor(r()*16),Math.floor(r()*16),1,1,'#6a44a8')});
  V('planks',1,planksTex);
  V('iron',1,blockTex('#d8d8d8','#c4c4c4','#f6f6f6','#9a9a9a'));
  V('gold',1,blockTex('#f5d63a','#e6c22a','#fff6a0','#b08a10'));
  V('diamond',1,blockTex('#62e6ee','#46d2da','#d2fdff','#2a9aa2'));
  V('emeraldb',1,blockTex('#2fd15a','#22b94b','#a5f7b8','#127a32'));
  V('glowstone',1,(g,r)=>{speck(g,r,['#c9a24a','#e8c062','#fbe19a','#a07a2a','#fff2c0'],1)});
  V('leaves',3,(g,r)=>speck(g,r,['#3f7f22','#356f1c','#4b9128','#2a5a15','#58a030'],1.2));
  V('spruce',2,(g,r)=>speck(g,r,['#2f5a32','#284f2b','#376638','#1f4022'],1.2));
  V('cactus',1,(g,r)=>{speck(g,r,['#4f8f2f','#45822a','#5aa036']);for(let y=1;y<16;y+=4)for(let x=1;x<16;x+=4)R(g,x+(y%8?2:0),y,1,1,'#d8e8b0')});
  V('log',1,(g,r)=>{speck(g,r,['#6b5233','#5f472b','#76603c']);g.strokeStyle='#a2834f';g.lineWidth=1;g.strokeRect(3.5,3.5,9,9);g.strokeRect(6.5,6.5,3,3)});
  V('mossy',1,(g,r)=>{cobbleTex(g,r);for(let i=0;i<30;i++)R(g,Math.floor(r()*16),Math.floor(r()*16),1,1,r()<.5?'#4a7a2a':'#5a8f35')});
  V('ore_coal',1,oreTex(STONE,['#2b2b2b','#1a1a1a','#444']));
  V('ore_iron',1,oreTex(STONE,['#d8af93','#c59478','#f0cdb5']));
  V('ore_gold',1,oreTex(STONE,['#fcee4b','#d8b520','#fffbb0']));
  V('ore_redstone',1,oreTex(STONE,['#e01010','#a00000','#ff6a6a']));
  V('ore_diamond',1,oreTex(STONE,['#5decf5','#2ab8c2','#d0ffff']));
  V('ore_emerald',1,oreTex(STONE,['#17dd62','#0a9a3a','#a8ffc8']));
  V('ore_quartz',1,oreTex(NRACK,['#ece6dc','#c8c0b0','#ffffff']));
  V('ore_ngold',1,oreTex(NRACK,['#fcee4b','#d8b520','#fffbb0']));
  V('ore_crystal',1,oreTex(ESTONE,['#b05cff','#7a2ad0','#f0d0ff']));
  // TNT
  TX.tntSide=makeTex(5,(g)=>{R(g,0,0,16,16,'#d42e1c');for(let x=0;x<16;x+=4)R(g,x+2,0,1,16,'#a8200f');R(g,0,5,16,6,'#eeeeee');R(g,0,5,16,1,'#bdbdbd');R(g,0,10,16,1,'#bdbdbd');
    const L=[["###",".#.",".#.",".#."],["#..#","##.#","#.##","#..#"],["###",".#.",".#.",".#."]];let ox=2;
    for(const l of L){l.forEach((row,y)=>{for(let x=0;x<row.length;x++)if(row[x]==='#')R(g,ox+x,6+y,1,1,'#1a1a1a')});ox+=l[0].length+1}});
  TX.tntTop=makeTex(6,(g)=>{R(g,0,0,16,16,'#c8301e');R(g,0,0,16,1,'#e85a40');R(g,0,15,16,1,'#8a1a0a');R(g,5,5,6,6,'#8a8a8a');R(g,6,6,4,4,'#5a5a5a');R(g,7,7,2,2,'#2a2a2a')});
  // lav ve su animasyon kareleri (döşenebilir)
  const LAVA=['#a52c08','#c8460c','#e26412','#f58a1e','#ffb238','#ffde78'],WATER=['#2a55c0','#3260cf','#3a6cdb','#4579e4','#5a8ced','#80aaf4'];
  const animTex=(cols,seed,amp)=>{const out=[],rr=mulberry32(seed),nz=[];for(let i=0;i<256;i++)nz.push(rr());
    for(let f=0;f<4;f++)out.push(makeTex(seed+f,(g)=>{for(let y=0;y<16;y++)for(let x=0;x<16;x++){const P=Math.PI*2;
      let v=Math.sin(P*(x/16*2+f/4))+Math.sin(P*(y/16+x/16-f/4))*.8+Math.sin(P*(y/16*2-f/4))*.5+(nz[y*16+x]-.5)*amp;
      v=(v+2.6)/5.2;g.fillStyle=cols[clamp(Math.floor(v*cols.length),0,cols.length-1)];g.fillRect(x,y,1,1)}}));return out};
  TX.lava=animTex(LAVA,77,1.6);TX.water=animTex(WATER,99,.9);
  // kırılma aşamaları
  const cr=mulberry32(1234),segs=[];
  for(let k=0;k<8;k++){let x=8,y=8;const a0=k/8*Math.PI*2+cr()*.5;for(let s=0;s<5;s++){const a=a0+(cr()-.5)*1.2,nx=x+Math.cos(a)*2.2,ny=y+Math.sin(a)*2.2;segs.push([x,y,nx,ny,s]);x=nx;y=ny}}
  TX.crack=[];for(let st=0;st<10;st++){const c=mkCanvas(16,16),g=c.getContext('2d');g.fillStyle='rgba(0,0,0,.75)';
    for(const s of segs){if(s[4]<=st/2){const steps=4;for(let i=0;i<=steps;i++){g.fillRect(Math.round(lerp(s[0],s[2],i/steps)),Math.round(lerp(s[1],s[3],i/steps)),1,1)}}}TX.crack.push(c)}
  // ışık sprite'ı
  TX.light=mkCanvas(64,64);{const g=TX.light.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.45,'rgba(255,255,255,.6)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)}
  TX.glow=mkCanvas(64,64);{const g=TX.glow.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,160,60,.55)');gr.addColorStop(1,'rgba(255,90,20,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)}
}

function pixCanvas(name,scale=1){const P=PIX[name],h=P.d.length,w=Math.max(...P.d.map(r=>r.length)),c=mkCanvas(w*scale,h*scale),g=c.getContext('2d');
  P.d.forEach((row,y)=>{for(let x=0;x<row.length;x++){const ch=row[x];if(ch!=='.'&&P.p[ch])R(g,x*scale,y*scale,scale,scale,P.p[ch])}});return c}
function drawPix(g,name,x,y,s){const P=PIX[name];P.d.forEach((row,yy)=>{for(let xx=0;xx<row.length;xx++){const ch=row[xx];if(ch!=='.'&&P.p[ch])R(g,x+xx*s,y+yy*s,s,s,P.p[ch])}})}

const LVTEX=['planks','cobble','iron','diamond'];
function pedestal(g,X,Y,lvl){
  const tex=TX[LVTEX[lvl]][0];
  g.fillStyle='rgba(0,0,0,.28)';g.fillRect(X+8,Y+12,40,36);
  g.drawImage(tex,X+4,Y+6,40,30);
  g.drawImage(tex,0,0,16,5,X+4,Y+36,40,10);
  R(g,X+4,Y+36,40,10,'rgba(0,0,0,.38)');R(g,X+4,Y+36,40,1,'rgba(0,0,0,.5)');
  g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=1;g.strokeRect(X+4.5,Y+6.5,39,39);
  for(let i=0;i<=lvl;i++){R(g,X+8+i*7,Y+39,4,4,'#ffd83d');R(g,X+8+i*7,Y+42,4,1,'#8a6a00')}
}
function crystal(g,x,y,w,h,c1,c2){g.beginPath();g.moveTo(x,y-h);g.lineTo(x+w/2,y-h+w*.6);g.lineTo(x+w/2,y);g.lineTo(x-w/2,y);g.lineTo(x-w/2,y-h+w*.6);g.closePath();g.fillStyle=c1;g.fill();
  g.beginPath();g.moveTo(x,y-h);g.lineTo(x+w/2,y-h+w*.6);g.lineTo(x+w/2,y);g.lineTo(x,y);g.closePath();g.fillStyle=c2;g.fill()}
function drawTower(g,type,lvl,X,Y,ang,time,tw){
  const cx=X+24,cy=Y+21;

  if(type==='landmine'){drawMine(g,X,Y);return}
  pedestal(g,X,Y,lvl);
  switch(type){
  case'archer':{R(g,cx-10,cy-8,20,16,'#4a3018');R(g,cx-9,cy-7,18,14,'#7a5630');R(g,cx-9,cy-7,18,2,'#9a7040');
    g.save();g.translate(cx,cy-2);g.rotate(ang);const pull=tw?clamp(1-tw.cd/(tw.s?tw.s.cd:1),0,1)*3:2;
    R(g,-9,-2,16,4,'#6b4423');R(g,-9,-2,16,1,'#8a5a2e');
    R(g,5,-12,3,4,'#7a4a20');R(g,7,-8,3,16,'#9b6a35');R(g,5,8,3,4,'#7a4a20');
    R(g,4-pull,-10,1,20,'#e8e8e8');
    R(g,-5-pull,-1,15,2,'#d8d8d8');R(g,10-pull,-2,3,4,'#8a8a8a');R(g,-7-pull,-2,3,4,'#e04040');
    if(lvl>=3){R(g,-5-pull,-5,15,2,'#d8d8d8');R(g,10-pull,-6,3,3,'#8a8a8a')}
    g.restore();break}
  case'ice':{const b=Math.sin(time*2.5)*1.5;g.globalAlpha=.35;g.drawImage(TX.light,cx-20,cy-28,40,40);g.globalAlpha=1;
    R(g,cx-11,cy+1,22,5,'#7ab8e8');R(g,cx-11,cy+1,22,1,'#bfe4ff');
    crystal(g,cx,cy+2+b*.3,8,22+lvl*2,'#bfe8ff','#8fc8f0');crystal(g,cx-8,cy+3,6,13+lvl,'#a8dcff','#78b0e0');crystal(g,cx+8,cy+3,6,14+lvl,'#a8dcff','#78b0e0');

    for(let i=0;i<3+lvl;i++){const a=time*1.5+i*2.1;R(g,cx+Math.cos(a)*14-1,cy-10+Math.sin(a)*5-1,2,2,'#ffffff')}
    break}
  case'tnt':{g.drawImage(TX.tntSide,X+30,Y+7,12,12);R(g,X+30,Y+7,12,2,'rgba(255,255,255,.2)');

    R(g,-11-rec,-4,4,8,'#444');R(g,1-rec,-5,2,10,['#8a6a3a','#9a9a9a','#e8e8e8','#5decf5'][lvl]);
    g.restore();break}

    g.globalAlpha=.45;g.drawImage(TX.glow,cx-22,cy-32,44,44);g.globalAlpha=1;

let G=null;
const canvas=$('game'),ctx=canvas.getContext('2d');canvas.width=W;canvas.height=H;
const bgCanvas=mkCanvas(W,H),bctx=bgCanvas.getContext('2d');
const LW=W/2,LH=H/2,lightCanvas=mkCanvas(LW,LH),lctx=lightCanvas.getContext('2d');
[ctx,bctx].forEach(c=>c.imageSmoothingEnabled=false);

function buildPath(wps){const pts=wps.map(([c,r])=>({x:c*TILE+TILE/2,y:r*TILE+TILE/2})),seg=[];let len=0;
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],l=Math.hypot(b.x-a.x,b.y-a.y);seg.push({a,b,l,s:len,dx:(b.x-a.x)/l,dy:(b.y-a.y)/l});len+=l}return{pts,seg,len}}
function pathPos(P,d){d=clamp(d,0,P.len);for(const s of P.seg){if(d<=s.s+s.l){const k=d-s.s;return{x:s.a.x+s.dx*k,y:s.a.y+s.dy*k,dx:s.dx,dy:s.dy}}}const s=P.seg[P.seg.length-1];return{x:s.b.x,y:s.b.y,dx:s.dx,dy:s.dy}}
const isOver=b=>b==='plains'||b==='desert'||b==='tundra';
function cell(tx,ty){return(tx>=0&&ty>=0&&tx<COLS&&ty<ROWS)?G.grid[ty][tx]:null}
function unlockedTower(type){return(G&&(G.diff.creative||G.demo))||TOWERS[type].unlock<=SAVE.unlocked}

function newGame(mapIdx,diffKey,endless,demo){
  const M=MAPS[mapIdx],D=DIFFS[diffKey];
  G={mapIdx,map:M,diff:D,diffKey,endless:!!endless,demo:!!demo,
    money:Math.round((M.money*D.start)+(demo?0:perk('rich')*30)),lives:D.lives+(D.creative?0:perk('health')*2),
    wave:0,totalWaves:endless?Infinity:M.waves,waves:[],enemies:[],towers:[],traps:[],projs:[],eprojs:[],parts:[],texts:[],clouds:[],bolts:[],orbs:[],golems:[],drops:[],weather:[],rings:[],
    time:0,speed:1,paused:false,over:false,sel:null,place:null,hover:null,mouse:{x:-99,y:-99,in:false},mining:null,shake:0,tod:0,todT:0,flash:0,hurtFx:0,rain:false,thunderT:rand(8,16),
    abil:{tnt:0,freeze:0,golem:0,apple:0},aim:null,appleT:0,boss:null,eid:0,nextDef:null,autoT:-1,
    stats:{kills:0,built:0,leaked:0,earned:0,mined:0,dmg:0,xp:0},grid:[],decor:[],lights:[],animTiles:[],rng:mulberry32(hashStr(M.id))};
  G.maxLives=G.lives;
  G.paths=M.paths.map(buildPath);
  for(let y=0;y<ROWS;y++){G.grid.push([]);for(let x=0;x<COLS;x++)G.grid[y].push({t:'ground',obs:null,tower:null,trap:null,v:Math.floor(G.rng()*4)})}
  const rect=(list,t)=>(list||[]).forEach(([x,y,w,h])=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++){const c=cell(i,j);if(c)c.t=t}});
  rect(M.water,'water');rect(M.lava,'lava');rect(M.voids,'void');rect(M.ice,'ice');
  for(const wps of M.paths){for(let i=0;i<wps.length-1;i++){let[x0,y0]=wps[i];const[x1,y1]=wps[i+1];const sx=Math.sign(x1-x0),sy=Math.sign(y1-y0);
    while(true){const c=cell(x0,y0);if(c)c.t='path';if(x0===x1&&y0===y1)break;x0+=sx;y0+=sy}}}
  const rng=G.rng,obsKeys=Object.keys(M.obs);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const c=G.grid[y][x];if(c.t!=='ground'&&c.t!=='ice')continue;
    let near=false;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const n=cell(x+i,y+j);if(n&&n.t==='path')near=true}
    let roll=rng()*(near?1.9:1),acc=0;
    for(const k of obsKeys){acc+=M.obs[k];if(roll<acc){if(c.t==='ice'&&!['rock','coal','iron','diamond','emerald'].includes(k))break;c.obs=k;break}}
    if(!c.obs&&rng()<.35)G.decor.push({x:x*TILE+6+rng()*36,y:y*TILE+6+rng()*36,k:Math.floor(rng()*6),s:rng()});
  }
  if(M.biome==='cave'||M.biome==='nether'||M.biome==='void'){for(let i=0;i<8;i++){const x=Math.floor(rng()*COLS),y=Math.floor(rng()*ROWS),c=cell(x,y);if(c&&c.t==='ground'&&!c.obs)c.torch=true}}
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const c=G.grid[y][x];if(c.t==='water'||c.t==='lava'||c.t==='void')G.animTiles.push({x,y,t:c.t})}
  renderBG();
  if(!demo){SFX_MUTED=false;setMood(M.mood)}else SFX_MUTED=true;
  G.nextDef=genWave(G.wave+1);
  return G;
}

/* ============================ DALGALAR ============================ */
function isNight(w){return isOver(G.map.biome)&&w>0&&(w%6===5||w%6===0)}
function genWave(w){
  const M=G.map,E=G.endless;let pool=M.pool;
  if(E){const all={};MAPS.forEach(m=>m.pool.forEach(([t,f,wt])=>{if(!all[t]||all[t][1]>f)all[t]=[t,Math.max(1,Math.round(f*1.4)),wt]}));pool=Object.values(all)}
  const avail=pool.filter(p=>w>=p[1]);
  const total=E?9999:M.waves;
  const boss=E?(w%10===0):(w===total);
  const night=isNight(w);
  let budget=4+w*1.9+Math.pow(w,1.5)*.45;if(boss)budget*=.55;
  const nG=w<3?1:w<8?2:3,groups=[];
  const wsum=avail.reduce((a,p)=>a+p[2]*(1+(w-p[1])*.05),0);
  for(let i=0;i<nG;i++){let roll=Math.random()*wsum,tp=avail[0][0];for(const p of avail){roll-=p[2]*(1+(w-p[1])*.05);if(roll<=0){tp=p[0];break}}
    const d=ENEMIES[tp],cnt=Math.max(2,Math.round(budget/nG/d.threat));groups.push({type:tp,count:cnt,iv:clamp(.95/d.spd,.32,1.5)*(cnt>20?.75:1),delay:i*3})}
  if(night){groups.push({type:'bat',count:3+Math.floor(w/3),iv:.5,delay:2});if(w>=11)groups.push({type:'ghost',count:2+Math.floor(w/6),iv:1.2,delay:6})}
  if(w%5===0&&!boss&&w>=5){const elite=w>=15?'knight':'armored';groups.push({type:elite,count:2+Math.floor(w/5),iv:1.2,delay:5})}
  let bossType=null;if(boss){bossType=E?BOSS_LIST[(w/10-1)%BOSS_LIST.length]:M.boss;groups.push({type:bossType,count:1,iv:1,delay:6})}
  let hpMul=(1+(w-1)*.11+(w-1)*(w-1)*.005)*G.diff.hp*(night?1.1:1);
  if(E&&w>20)hpMul*=Math.pow(1.035,w-20);
  const bossMul=G.diff.hp*(E?(.5+w*.05):1);
  const spawns=[];let pc=0;
  for(const gr of groups)for(let i=0;i<gr.count;i++)spawns.push({t:gr.delay+i*gr.iv,type:gr.type,path:(pc++)%G.paths.length});
  spawns.sort((a,b)=>a.t-b.t);
  const counts={};groups.forEach(g=>counts[g.type]=(counts[g.type]||0)+g.count);
  return{n:w,spawns,hpMul,bossMul,night,boss:bossType,counts};
}
function startNextWave(){
  if(!G||G.over)return;if(!G.endless&&G.wave>=G.totalWaves)return;
  const early=G.waves.length>0||G.enemies.length>0;
  const def=G.nextDef||genWave(G.wave+1);G.wave++;
  const w={...def,n:G.wave,idx:0,time:0,alive:0,leaks:0};G.waves.push(w);
  G.nextDef=(!G.endless&&G.wave>=G.totalWaves)?null:genWave(G.wave+1);
  G.autoT=-1;
  if(early&&!G.demo){const b=Math.round((10+G.wave*2)*G.diff.money);gain(b);floatText(W-80,H-30,'+'+b+' erken bonus','#7dff8f',16)}
  G.todT=def.night?1:0;
  if(G.map.biome==='plains')G.rain=Math.random()<.3||(def.night&&Math.random()<.5);else G.rain=false;
  if(!G.demo){
    sfx('horn');
    if(def.boss)banner('⚠ BOSS DALGASI ⚠','<small>'+ENEMIES[def.boss].name+' yaklaşıyor!</small>');
    else if(def.night&&!isNight(G.wave-1))banner('GECE ÇÖKTÜ','<small>Yaratıklar %10 daha güçlü, yarasalar uyandı!</small>');
    else banner('DALGA '+G.wave);
    tutorialStep('wave');
  }
  updateWaveUI();
}
function waveCleared(w){
  if(G.demo)return;
  const bonus=Math.round((20+w.n*3)*G.diff.money);gain(bonus);
  let inc=0;for(const t of G.towers)if(t.type==='mine'){const v=Math.round(t.s.income*G.diff.money);inc+=v;floatText(t.x,t.y-20,'+'+v,'#7dff8f',16);sparkle(t.x,t.y-10,'#2fd15a',8)}
  gain(inc);if(inc)sfx('coin');
  addXP(5+w.n);
  if(w.night&&w.leaks===0)unlockAch('night');
  const all=G.waves.length===0&&G.enemies.length===0;
  if(all&&(G.endless||G.wave<G.totalWaves))banner('Dalga '+w.n+' Temizlendi!','<small>+'+(bonus+inc)+' zümrüt</small>');
  if(G.endless){const best=SAVE.endlessBest[G.map.id]||0;if(w.n>best){SAVE.endlessBest[G.map.id]=w.n;saveGame()}if(w.n>=30)unlockAch('endless30')}
  if(SAVE.settings.autoWave&&all)G.autoT=3;
}
function updateWaves(dt){
  for(const w of G.waves){w.time+=dt;while(w.idx<w.spawns.length&&w.spawns[w.idx].t<=w.time){const s=w.spawns[w.idx++];spawnEnemy(s.type,s.path,w,0)}}
  for(let i=G.waves.length-1;i>=0;i--){const w=G.waves[i];if(w.idx>=w.spawns.length&&w.alive<=0){G.waves.splice(i,1);waveCleared(w);updateWaveUI()}}
  if(G.autoT>0){G.autoT-=dt;if(G.autoT<=0&&G.waves.length===0)startNextWave()}
  if(G.demo&&G.waves.length===0&&G.time>2){G.demoT=(G.demoT||0)+dt;if(G.demoT>3){G.demoT=0;if(G.wave>=8){G.wave=1;G.nextDef=genWave(2)}startNextWave()}}
}
function spawnEnemy(type,pathIdx,w,dist,parent){
  const d=ENEMIES[type],P=G.paths[pathIdx];
  let hp=d.hp*(d.boss?w.bossMul:w.hpMul);if(parent&&parent.def.boss)hp=d.hp*w.hpMul*1.5;
  const p=pathPos(P,dist);
  const e={type,def:d,hp,maxHp:hp,dist,path:P,pi:pathIdx,x:p.x,y:p.y,off:d.boss?0:rand(-7,7),dir:p.dx<0?-1:1,anim:rand(0,6),t:rand(0,10),alive:true,wave:w,
    slowT:0,slow:0,burnT:0,burnDps:0,poisonT:0,poisonDps:0,weakT:0,weak:0,stunT:0,freezeT:0,flash:0,shootCd:rand(2,4),healCd:3,healFx:0,blinkCd:0,
    sumCd:d.summon?d.summon.every:0,stompCd:d.stomp?d.stomp.every:d.breath?d.breath.every:0,fuse:0,dotAcc:0,dotT:0,punch:0,inWeb:false,soundT:rand(1,5)};
  w.alive++;G.enemies.push(e);
  if(d.boss&&!G.demo){G.boss=e;$('bossbar').style.display='flex';$('bossName').textContent=d.name;MUS.boss=true;sfx('roar');shake(6)}
  return e;
}

/* ============================ KULE ============================ */
function towerCost(type,lvl){let c=TOWERS[type].lv[lvl].cost;if(lvl>0)c*=1-perk('master')*.04;return Math.round(c)}
function canAfford(c){return G.diff.creative||G.demo||G.money>=c}
function spend(c){if(!G.diff.creative&&!G.demo)G.money-=c}
function gain(c){G.money+=c;if(c>0)G.stats.earned+=c;if(G.money>=2000&&!G.diff.creative)unlockAch('rich')}
function canPlace(type,tx,ty){const c=cell(tx,ty);if(!c)return false;const D=TOWERS[type];
  if(D.trap)return c.t==='path'&&!c.trap;return(c.t==='ground'||c.t==='ice')&&!c.obs&&!c.tower}
function computeStats(t){
  const D=TOWERS[t.type],s=Object.assign({},D.lv[t.lvl]),b=t.buff||{};
  const dm=(1+perk('sharp')*.05)*(1+(b.dmg||0));
  if(s.dmg)s.dmg*=dm;if(s.dps)s.dps*=dm;if(s.burn)s.burn*=dm;
  if(s.range)s.range*=(1+perk('range')*.03)*(1+(b.range||0));
  if(s.cd)s.cd/=(1+perk('haste')*.04)*(1+(b.rate||0));
  t.s=s;t.detect=t.lvl>=2||!!b.camo;
}
function recomputeBuffs(){
  for(const t of G.towers)t.buff={};
  for(const bt of G.towers){if(bt.type!=='beacon')continue;const L=TOWERS.beacon.lv[bt.lvl],r2=(L.radius*TILE)**2;
    for(const t of G.towers){if(t===bt||t.type==='beacon'||t.type==='mine')continue;if(d2(t.x,t.y,bt.x,bt.y)<=r2+1){const b=t.buff;b.dmg=Math.max(b.dmg||0,L.bDmg||0);b.range=Math.max(b.range||0,L.bRange||0);b.rate=Math.max(b.rate||0,L.bRate||0);b.camo=true}}}
  for(const t of G.towers)computeStats(t);
}
function buildTower(type,tx,ty){
  if(!unlockedTower(type)){sfx('error');return false}
  if(!canPlace(type,tx,ty)){sfx('error');return false}
  const cost=towerCost(type,0);if(!canAfford(cost)){sfx('error');floatText(tx*TILE+24,ty*TILE+10,'Yetersiz zümrüt!','#ff5555',15);return false}
  spend(cost);const c=cell(tx,ty),x=tx*TILE+TILE/2,y=ty*TILE+TILE/2;
  if(TOWERS[type].trap){const tr={type,tx,ty,x,y,life:TOWERS[type].lv[0].life||1e9,dur:type==='web'?14:1};c.trap=tr;G.traps.push(tr);sfx('place');dust(x,y,'#bbb',8);return true}
  const t={type,lvl:0,tx,ty,x,y,cd:.3,ang:-Math.PI/2,mode:type==='ballista'?2:0,kills:0,dmg:0,spent:cost,stunT:0,recoil:0,punch:0,builtAt:G.wave,buff:{},trickT:0};
  c.tower=t;G.towers.push(t);recomputeBuffs();
  sfx('place');dust(x,y+14,'#9a8a6a',12);G.stats.built++;
  if(G.stats.built>=12)unlockAch('builder');
  tutorialStep('built');return true;
}
function upgradeTower(t){
  if(t.lvl>=3)return;const c=towerCost(t.type,t.lvl+1);if(!canAfford(c)){sfx('error');return}
  spend(c);t.lvl++;t.spent+=c;recomputeBuffs();sfx('upgrade');sparkle(t.x,t.y,'#ffd83d',16);
  if(t.lvl===3)unlockAch('maxed');refreshPanel(true);
}
function sellValue(t){return(t.builtAt===G.wave&&G.waves.length===0&&G.enemies.length===0)?t.spent:Math.floor(t.spent*.7)}
function sellTower(t){
  const v=sellValue(t);G.money+=v;const c=cell(t.tx,t.ty);c.tower=null;G.towers.splice(G.towers.indexOf(t),1);recomputeBuffs();
  sfx('sell');floatText(t.x,t.y-10,'+'+v,'#7dff8f',16);blockBreak(t.x,t.y,TX[LVTEX[t.lvl]][0]);selectTower(null);
}
function findTarget(t,range,exclude){
  const D=TOWERS[t.type],r2=(range*TILE)**2;let best=null,bv=-Infinity;
  for(const e of G.enemies){if(!e.alive||(exclude&&exclude.has(e)))continue;if(e.def.flying&&!D.air)continue;if(e.def.camo&&!t.detect)continue;
    const dd=d2(t.x,t.y,e.x,e.y);if(dd>r2)continue;let v;
    switch(t.mode){case 0:v=-(e.path.len-e.dist);break;case 1:v=e.path.len-e.dist;break;case 2:v=e.hp;break;case 3:v=-e.hp;break;default:v=-dd}
    if(v>bv){bv=v;best=e}}
  return best;
}
function critRoll(base){return Math.random()<perk('luck')*.03+(base||0)}
function updateTower(t,dt){
  const s=t.s;t.recoil=Math.max(0,t.recoil-dt*4);t.punch=Math.max(0,t.punch-dt);
  if(t.stunT>0){t.stunT-=dt;return}
  if(t.type==='mine'){if(s.trickle){t.trickT+=dt;if(t.trickT>=3){t.trickT=0;if(G.waves.length)gain(1)}}return}
  if(t.type==='beacon')return;
  t.cd-=dt*(G.appleT>0?1.5:1);
  const tg=findTarget(t,s.range);
  if(tg){const a=Math.atan2(tg.y-t.y,tg.x-t.x);let da=a-t.ang;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;t.ang+=da*Math.min(1,dt*14)}
  if(t.cd>0||!tg)return;
  t.cd=s.cd;fireTower(t,tg,s);
}
function fireTower(t,tg,s){
  const mx=t.x+Math.cos(t.ang)*14,my=t.y-4+Math.sin(t.ang)*14;
  switch(t.type){
  case'archer':{const targets=[tg];if(s.multi){const ex=new Set([tg]);for(let i=1;i<s.multi;i++){const o=findTarget(t,s.range,ex);if(o){targets.push(o);ex.add(o)}}}
    targets.forEach((e,i)=>G.projs.push({k:'arrow',x:mx,y:my+i*3,tg:e,spd:560,dmg:s.dmg,src:t}));sfx('arrow');break}
  case'ice':G.projs.push({k:'ice',x:mx,y:my,tg,spd:420,dmg:s.dmg,src:t,s});sfx('ice');break;
  case'fire':{const targets=[tg];if(s.spread){const ex=new Set([tg]);for(let i=1;i<s.spread;i++){const o=findTarget(t,s.range,ex);if(o){targets.push(o);ex.add(o)}}}
    targets.forEach(e=>G.projs.push({k:'fire',x:mx,y:my,tg:e,spd:380,dmg:s.dmg,src:t,s}));sfx('fire');break}
  case'tnt':{const ft=.8,fp=pathPos(tg.path,tg.dist+effSpeed(tg)*ft);G.projs.push({k:'tnt',x:mx,y:my,sx:mx,sy:my,ex:fp.x-fp.dy*tg.off,ey:fp.y+fp.dx*tg.off,T:ft,t:0,src:t,s,rot:0});t.recoil=1;sfx('fuse');break}
  case'potion':{const ft=.75,fp=pathPos(tg.path,tg.dist+effSpeed(tg)*ft);G.projs.push({k:'potion',x:t.x,y:t.y-20,sx:t.x,sy:t.y-20,ex:fp.x,ey:fp.y,T:ft,t:0,src:t,s,rot:0,col:pick(['#a040c0','#40c060'])});break}
  case'ballista':{const a=Math.atan2(tg.y-t.y,tg.x-t.x);G.projs.push({k:'bolt',x:t.x,y:t.y-4,vx:Math.cos(a)*720,vy:Math.sin(a)*720,left:s.range*TILE*1.15,hit:new Set(),pierce:s.pierce,dmg:s.dmg,src:t,s,ang:a});sfx('ballista');break}
  case'piston':{const list=s.allHit?G.enemies.filter(e=>e.alive&&!e.def.flying&&(!e.def.camo||t.detect)&&d2(t.x,t.y,e.x,e.y)<=(s.range*TILE)**2):[tg];
    t.punch=.3;sfx('piston');for(const e of list){hitEnemy(e,s.dmg,'phys',t);knockback(e,s.knock*TILE);dust(e.x,e.y+8,'#bbb',4)}break}
  case'lightning':{const hit=new Set(),pts=[{x:t.x,y:t.y-32}];let cur=tg,dmg=s.dmg;
    for(let i=0;i<s.chain&&cur;i++){hit.add(cur);pts.push({x:cur.x,y:cur.y-10});hitEnemy(cur,dmg,'magic',t);if(s.stun&&cur.alive&&!cur.def.boss)cur.stunT=Math.max(cur.stunT,s.stun);
      dmg*=.85;let nx=null,nd=(1.8*TILE)**2;for(const e of G.enemies){if(!e.alive||hit.has(e))continue;if(e.def.camo&&!t.detect)continue;const dd=d2(cur.x,cur.y,e.x,e.y);if(dd<nd){nd=dd;nx=e}}cur=nx}

  }
}
function jag(pts){const out=[pts[0]];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];for(let k=1;k<=4;k++){const f=k/4;out.push({x:lerp(a.x,b.x,f)+(k<4?rand(-7,7):0),y:lerp(a.y,b.y,f)+(k<4?rand(-7,7):0)})}}return out}

function effSpeed(e){if(e.stunT>0||e.freezeT>0||e.fuse>0)return 0;let sp=e.def.spd*TILE*(1-e.slow);if(G.wave&&isNight(G.wave))sp*=1.08;return sp}
function hitEnemy(e,amt,type,src){
  if(!e.alive)return 0;let crit=false;
  if(src&&critRoll(src.s&&src.s.crit)){amt*=2;crit=true}
  return damage(e,amt,type,src,crit);
}
function damage(e,amt,type,src,crit){
  if(!e.alive)return 0;const d=e.def;
  if((type==='fire'||type==='burn')&&d.fireImm){if(type==='fire'&&Math.random()<.2)floatText(e.x,e.y-20,'BAĞIŞIK','#ffaa00',12);return 0}
  let a=amt;if(e.weakT>0)a*=1+e.weak;
  if(d.armor){if(type==='phys')a=Math.max(a*.2,a-d.armor);else if(type==='blast')a=Math.max(a*.3,a-d.armor*.5);else if(type==='ice')a=Math.max(a*.5,a-d.armor*.5)}
  e.hp-=a;G.stats.dmg+=a;if(src)src.dmg+=a;
  const dot=type==='burn'||type==='poison';
  if(!dot){e.flash=.12;if(SAVE.settings.dmgNums&&!G.demo)floatText(e.x+rand(-6,6),e.y-(d.h||20)*enemyScale(d)*.8,(crit?'✦':'')+Math.round(a),crit?'#ffe040':'#ffffff',crit?17:13);hurtSound(e)}
  else e.dotAcc+=a;
  if(d.blink&&e.blinkCd<=0&&e.hp>0){e.blinkCd=3.5;const ox=e.x,oy=e.y;e.dist=Math.min(e.path.len-TILE*.5,e.dist+TILE*1.6);puff(ox,oy,'#6a3a9a',10);sfx('blink')}
  if(e.hp<=0)killEnemy(e,src);
  return a;
}
function hurtSound(e){const k=e.def.draw;if(k.includes('ombie')||k==='armored'||k==='baby'||k==='bomber')sfx('hit');else if(k.includes('kelet')||k==='knight'||k==='bossBone')sfx('skeleton');else if(k.includes('pider'))sfx('spider');else if(k==='slime')sfx('slime');else if(k.includes('agma'))sfx('magma');else sfx('hit')}
function killEnemy(e,src){
  if(!e.alive)return;e.alive=false;const d=e.def;e.wave.alive--;
  if(!G.demo){
    const rw=Math.round(d.reward*(1+G.wave*.03)*(1+perk('loot')*.06)*G.diff.money);gain(rw);
    floatText(e.x,e.y-6,'+'+rw,'#7dff8f',13);
    G.stats.kills++;SAVE.kills++;addXP(d.xp||1,e.x,e.y);
    if(G.stats.kills===1)unlockAch('firstKill');if(SAVE.kills>=1000)unlockAch('kill1000');
  }

  if(d.draw.includes('ombie')||d.draw==='armored'||d.draw==='baby')sfx('zombieDie');else if(d.draw==='slime')sfx('slime');else if(d.draw.includes('agma'))sfx('magma');else sfx('pop');
  if(d.split){for(let i=0;i<d.splitN;i++){const c=spawnEnemy(d.split,e.pi,e.wave,Math.max(0,e.dist-i*10-rand(0,8)),e);c.off=rand(-10,10);c.stunT=.2}}
  if(d.boss){if(G.boss===e){G.boss=null;$('bossbar').style.display='none';MUS.boss=false}
    if(!G.demo){explodeFX(e.x,e.y,90,true);sfx('explosion');shake(14);unlockAch('boss');if(e.type==='bossDragon')unlockAch('dragon');banner(d.name+' YENİLDİ!','<small>+'+Math.round(d.reward*G.diff.money)+' zümrüt</small>')}}
}
function knockback(e,amt){if(e.def.boss)amt*=.15;e.dist=Math.max(0,e.dist-amt)}
function leak(e){
  e.alive=false;e.wave.alive--;e.wave.leaks++;
  if(G.demo)return;
  const L=e.def.lives||1;G.lives-=L;G.stats.leaked+=L;sfx('leak');shake(5);G.hurtFx=.4;

}
function updateEnemy(e,dt){
  const d=e.def;e.t+=dt;e.flash-=dt;e.blinkCd-=dt;e.punch=Math.max(0,e.punch-dt);e.healFx-=dt;
  if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slow=0}
  if(e.inWeb){e.slow=Math.max(e.slow,.6);e.slowT=Math.max(e.slowT,.1)}
  if(e.burnT>0){e.burnT-=dt;damage(e,e.burnDps*dt,'burn',e.burnSrc);if(Math.random()<dt*14)addP({x:e.x+rand(-6,6),y:e.y-rand(4,20),vx:0,vy:-30,life:.4,max:.4,sz:3,c:pick(['#ff7a1a','#ffb020','#ffe080']),g:0});if(!e.alive)return}
  if(e.poisonT>0){e.poisonT-=dt;damage(e,e.poisonDps*dt,'poison',e.poisonSrc);if(Math.random()<dt*6)addP({x:e.x+rand(-6,6),y:e.y-rand(4,18),vx:0,vy:-18,life:.6,max:.6,sz:2,c:'#7ae04a',g:0});if(!e.alive)return}
  if(e.weakT>0)e.weakT-=dt;
  e.dotT-=dt;if(e.dotT<=0){e.dotT=.45;if(e.dotAcc>=1&&SAVE.settings.dmgNums&&!G.demo)floatText(e.x+rand(-5,5),e.y-24,Math.round(e.dotAcc),e.burnT>0?'#ffaa40':'#9aff60',12);e.dotAcc=0}
  if(e.freezeT>0)e.freezeT-=dt;
  if(e.stunT>0)e.stunT-=dt;
  e.inWeb=false;
  e.soundT-=dt;if(e.soundT<=0){e.soundT=rand(4,9);const k=d.draw;if(k==='zombie'||k==='bossZombie')sfx('zombie');else if(k==='bat')sfx('bat');else if(k==='ghost')sfx('ghost');else if(k==='witch')sfx('witch')}
  if(e.stunT<=0&&e.freezeT<=0){
    if(d.shooter){e.shootCd-=dt;if(e.shootCd<=0){const tw=nearestTower(e.x,e.y,(d.boss?3.5:2.6)*TILE);e.shootCd=d.boss?2.5:4;
      if(tw){const a=Math.atan2(tw.y-e.y,tw.x-e.x);G.eprojs.push({x:e.x,y:e.y-14,vx:Math.cos(a)*330,vy:Math.sin(a)*330,tw,stun:d.boss?2.5:1.2,cursed:!!d.boss});sfx('arrow')}}}
    if(d.healer){e.healCd-=dt;if(e.healCd<=0){e.healCd=3;let any=false;for(const o of G.enemies){if(!o.alive||o===e)continue;if(d2(o.x,o.y,e.x,e.y)<(2*TILE)**2&&o.hp<o.maxHp){o.hp=Math.min(o.maxHp,o.hp+o.maxHp*(o.def.boss?.03:.12));sparkle(o.x,o.y-12,'#ff70ff',4);any=true}}if(any){e.healFx=.5;sfx('heal')}}}
    if(d.bomber&&e.fuse<=0){const tw=nearestTower(e.x,e.y,1.25*TILE);if(tw){e.fuse=1.3;sfx('hiss')}}
    if(d.summon){e.sumCd-=dt;if(e.sumCd<=0){e.sumCd=d.summon.every;for(let i=0;i<d.summon.n;i++){const c=spawnEnemy(d.summon.type,e.pi,e.wave,Math.max(0,e.dist-rand(10,40)),e);c.off=rand(-12,12)}puff(e.x,e.y,'#4a2a5a',16);sfx('witch')}}
    if(d.stomp){e.stompCd-=dt;if(e.stompCd<=0){e.stompCd=d.stomp.every;e.punch=.35;stunTowersAround(e.x,e.y,d.stomp.radius,d.stomp.stun,'#bfe8ff');sfx('golem');shake(8);ring(e.x,e.y+10,d.stomp.radius*TILE,'190,232,255')}}
    if(d.breath){e.stompCd-=dt;if(e.stompCd<=0){e.stompCd=d.breath.every;stunTowersAround(e.x,e.y,d.breath.radius,d.breath.stun,'#c060ff');sfx('roar');ring(e.x,e.y,d.breath.radius*TILE,'200,100,255');for(let i=0;i<40;i++){const a=rand(0,Math.PI*2),sp=rand(40,160);addP({x:e.x,y:e.y-30,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,max:1,sz:rand(3,6),c:pick(['#b040ff','#e080ff','#6a1aa0']),g:0,smoke:true})}}}
  }
  if(e.fuse>0){e.fuse-=dt;if(e.fuse<=0){stunTowersAround(e.x,e.y,1.6,5,'#ff8040');explodeFX(e.x,e.y,1.6*TILE,false);sfx('explosion');shake(7);e.alive=false;e.wave.alive--;return}}
  let blocked=false;
  if(!d.flying&&!d.boss){for(const gm of G.golems){const dd=d2(e.x,e.y,gm.x,gm.y);if(dd<26*26){const fp=pathPos(e.path,e.dist+6);if(d2(fp.x,fp.y,gm.x,gm.y)<dd){blocked=true;break}}}}
  const sp=blocked?0:effSpeed(e);
  e.dist+=sp*dt;if(sp>0)e.anim+=dt*sp/TILE*6;
  const p=pathPos(e.path,e.dist),nx=p.x-p.dy*e.off,ny=p.y+p.dx*e.off;
  if(Math.abs(nx-e.x)>.05)e.dir=nx>e.x?1:-1;e.x=nx;e.y=ny;
  if(!d.flying){const c=cell(Math.floor(e.x/TILE),Math.floor(e.y/TILE));if(c&&c.trap){const tr=c.trap;
    if(tr.type==='web'&&!d.webImm){e.inWeb=true;tr.dur-=dt}
    else if(tr.type==='landmine'){const L=TOWERS.landmine.lv[0];removeTrap(tr);explode(tr.x,tr.y,L.splash,L.dmg*(1+perk('sharp')*.05)*(1+G.wave*.04),null,{})}}}
  if(e.alive&&e.dist>=e.path.len)leak(e);
}
function removeTrap(tr){const c=cell(tr.tx,tr.ty);if(c&&c.trap===tr)c.trap=null;const i=G.traps.indexOf(tr);if(i>=0)G.traps.splice(i,1)}
function nearestTower(x,y,r){let best=null,bd=r*r;for(const t of G.towers){const dd=d2(x,y,t.x,t.y);if(dd<bd){bd=dd;best=t}}return best}
function stunTowersAround(x,y,rad,dur,col){const r2=(rad*TILE)**2;let n=0;for(const t of G.towers){if(d2(x,y,t.x,t.y)<=r2){t.stunT=Math.max(t.stunT,dur);n++;sparkle(t.x,t.y-10,col,5)}}if(n)sfx('stun')}

function updateProjs(dt){
  for(let i=G.projs.length-1;i>=0;i--){const p=G.projs[i];let done=false;
    if(p.k==='arrow'||p.k==='ice'||p.k==='fire'){
      if(p.tg&&p.tg.alive){p.lx=p.tg.x;p.ly=p.tg.y-8-(p.tg.def.flying?14:0)}
      const tx=p.lx??p.x,ty=p.ly??p.y,dx=tx-p.x,dy=ty-p.y,dl=Math.hypot(dx,dy);if(dl>.01)p.ang=Math.atan2(dy,dx);
      if(dl<p.spd*dt+4){done=true;if(p.tg&&p.tg.alive){const e=p.tg;
          if(p.k==='arrow')hitEnemy(e,p.dmg,'phys',p.src);
          else if(p.k==='ice'){const s=p.s,list=s.splash?G.enemies.filter(o=>o.alive&&d2(o.x,o.y,e.x,e.y)<(s.splash*TILE)**2):[e];
            for(const o of list){hitEnemy(o,o===e?p.dmg:p.dmg*.5,'ice',p.src);if(!o.alive)continue;const sl=o.def.boss?s.slow*.5:s.slow;if(sl>=o.slow){o.slow=sl;o.slowT=s.slowT}else o.slowT=Math.max(o.slowT,s.slowT*.5);
              if(s.freeze&&!o.def.boss&&Math.random()<s.freeze)o.freezeT=1.2}
            sparkle(e.x,e.y-8,'#bfe8ff',6)}
          else{hitEnemy(e,p.dmg,'fire',p.src);if(e.alive&&!e.def.fireImm){e.burnDps=e.burnT>0?Math.max(e.burnDps,p.s.burn):p.s.burn;e.burnT=p.s.burnT;e.burnSrc=p.src}}
        }}
      else{p.x+=dx/dl*p.spd*dt;p.y+=dy/dl*p.spd*dt;if(p.k==='fire'&&Math.random()<.6)addP({x:p.x,y:p.y,vx:rand(-10,10),vy:rand(-20,0),life:.25,max:.25,sz:3,c:pick(['#ff7a1a','#ffb020']),g:0});
        if(p.k==='ice'&&Math.random()<.3)addP({x:p.x,y:p.y,vx:0,vy:0,life:.3,max:.3,sz:2,c:'#dff6ff',g:0})}
    }
    else if(p.k==='tnt'||p.k==='potion'){p.t+=dt;const f=Math.min(1,p.t/p.T);p.x=lerp(p.sx,p.ex,f);p.y=lerp(p.sy,p.ey,f)-Math.sin(f*Math.PI)*60;p.rot+=dt*8;
      if(f>=1){done=true;
        if(p.k==='tnt'){explode(p.ex,p.ey,p.s.splash,p.s.dmg,p.src,{});if(p.s.cluster){for(let k=0;k<p.s.cluster;k++){const a=k/p.s.cluster*Math.PI*2+rand(0,1);G.drops.push({x:p.ex+Math.cos(a)*30,y:p.ey+Math.sin(a)*30,h:0,vh:0,fuse:.35,dmg:p.s.dmg*.4,rad:.7,src:p.src,mini:true})}}}
        else{G.clouds.push({x:p.ex,y:p.ey,r:p.s.radius*TILE,dps:p.s.dps,t:p.s.cloudT,max:p.s.cloudT,weak:p.s.weak||0,slow:p.s.slowCloud||0,src:p.src,col:p.col});sfx('glass');
          for(let k=0;k<12;k++)addP({x:p.ex,y:p.ey,vx:rand(-80,80),vy:rand(-120,-20),life:.5,max:.5,sz:2,c:'#dde8ff',g:300})}}}
    else if(p.k==='bolt'){const st=Math.hypot(p.vx,p.vy)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.left-=st;
      for(const e of G.enemies){if(!e.alive||p.hit.has(e))continue;if(e.def.camo&&!p.src.detect)continue;if(d2(p.x,p.y,e.x,e.y-8)<18*18){p.hit.add(e);hitEnemy(e,p.dmg,'phys',p.src);if(p.hit.size>=p.pierce){done=true;break}}}
      if(p.left<=0||p.x<-20||p.y<-20||p.x>W+20||p.y>H+20)done=true}
    if(done)G.projs.splice(i,1);
  }
  for(let i=G.eprojs.length-1;i>=0;i--){const p=G.eprojs[i];p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(!G.towers.includes(p.tw)){G.eprojs.splice(i,1);continue}
    if(d2(p.x,p.y,p.tw.x,p.tw.y-8)<14*14){p.tw.stunT=Math.max(p.tw.stunT,p.stun);sparkle(p.tw.x,p.tw.y-8,p.cursed?'#b040ff':'#ffe040',4);G.eprojs.splice(i,1)}
    else if(p.x<-20||p.y<-20||p.x>W+20||p.y>H+20)G.eprojs.splice(i,1)}
  for(let i=G.clouds.length-1;i>=0;i--){const c=G.clouds[i];c.t-=dt;

      if(c.weak){e.weakT=1;e.weak=Math.max(e.weak,c.weak)}if(c.slow){e.slow=Math.max(e.slow,c.slow);e.slowT=Math.max(e.slowT,.3)}}}
    if(Math.random()<dt*20)addP({x:c.x+rand(-c.r,c.r)*.8,y:c.y+rand(-c.r,c.r)*.6,vx:0,vy:-12,life:.8,max:.8,sz:rand(3,6),c:c.col,g:0,smoke:true,a:.5});
    if(c.t<=0)G.clouds.splice(i,1)}
  for(let i=G.drops.length-1;i>=0;i--){const d=G.drops[i];if(d.h>0){d.vh+=900*dt;d.h-=d.vh*dt;if(d.h<=0){d.h=0;dust(d.x,d.y,'#aaa',5);sfx('place')}}
    else{d.fuse-=dt;if(d.fuse<=0){G.drops.splice(i,1);explode(d.x,d.y,d.rad,d.dmg,d.src,{small:d.mini,air:!!d.air})}}}
  for(let i=G.bolts.length-1;i>=0;i--){G.bolts[i].t-=dt;if(G.bolts[i].t<=0)G.bolts.splice(i,1)}
}
function explode(x,y,rad,dmg,src,o){
  const r=rad*TILE;let kills=0;

function update(dt){
  G.time+=dt;
  updateWaves(dt);
  for(let i=0;i<G.enemies.length;i++){const e=G.enemies[i];if(e.alive)updateEnemy(e,dt)}
  for(const t of G.towers)updateTower(t,dt);
  updateProjs(dt);updateGolems(dt);updateMining(dt);updateParts(dt);updateWeather(dt);
  for(let i=G.traps.length-1;i>=0;i--){const tr=G.traps[i];if(tr.type==='web'){tr.life-=dt;if(tr.life<=0||tr.dur<=0){removeTrap(tr);puff(tr.x,tr.y,'#ddd',5)}}}
  G.enemies=G.enemies.filter(e=>e.alive);
  for(const k in G.abil)if(G.abil[k]>0)G.abil[k]=Math.max(0,G.abil[k]-dt);
  if(G.appleT>0)G.appleT-=dt;
  G.tod=lerp(G.tod,G.todT,Math.min(1,dt*.6));
  G.shake=Math.max(0,G.shake-dt*30);G.flash=Math.max(0,G.flash-dt);G.hurtFx=Math.max(0,G.hurtFx-dt);
  if(!G.demo&&!G.over&&!G.endless&&G.wave>=G.totalWaves&&G.waves.length===0&&G.enemies.length===0)victory();
  if(G.demo)demoAI(dt);
}

  if(b==='plains')return TX.grass[v];
  if(b==='desert')return TX.sand[v%3];
  if(b==='tundra')return TX.snow[v%3];
  if(b==='cave'){const n=Math.sin(x*.7)+Math.cos(y*.9)+Math.sin((x+y)*.4);return n>.9?TX.deep[v%3]:TX.stone[v%3]}
  if(b==='nether'){const n=Math.sin(x*.5+1)+Math.cos(y*.6)+Math.sin((x-y)*.45);return n>1.1?TX.soul[v%3]:TX.netherrack[v%3]}
  return TX.endstone[v%3];
}

/* ---------- hotbar ---------- */
function towerTip(type){
  const D=TOWERS[type];let h=`<div class="t">${D.name}</div><div class="gr">${D.desc}</div>`;
  if(!unlockedTower(type))return h+`<div class="r">🔒 Kilitli — "${MAPS[D.unlock].name}" dünyasına ulaş.</div>`;
  h+=`<div class="g">Maliyet: ${towerCost(type,0)} zümrüt</div>`;
  statLines(type,0).forEach(([k,v])=>h+=`<div><span class="gr">${k}:</span> ${v}</div>`);
  if(!D.trap&&!D.eco&&!D.support)h+=`<div class="${D.air?'b':'r'}">${D.air?'✔ Uçanları vurur':'✘ Uçanları vuramaz'}</div>`;
  return h+`<div class="y">Kısayol: ${HOTKEYS[TOWER_ORDER.indexOf(type)]}</div>`;
}
function buildHotbar(){
  const hb=$('hotbar');hb.innerHTML='';
  TOWER_ORDER.forEach((type,i)=>{const s=document.createElement('div');s.className='slot';s.dataset.type=type;const cc=mkCanvas(56,56);cc.getContext('2d').drawImage(towerIcon(type),0,0);s.appendChild(cc);
    s.insertAdjacentHTML('beforeend',`<span class="key">${HOTKEYS[i]}</span><span class="cost">${towerCost(type,0)}</span>`);
    s.onclick=()=>selectPlace(type);s.onmouseenter=e=>showTip(towerTip(type),e.clientX,e.clientY);s.onmousemove=e=>showTip(towerTip(type),e.clientX,e.clientY);s.onmouseleave=hideTip;hb.appendChild(s)});
  updateHotbar();
}

/* ---------- kule paneli ---------- */
function statLines(type,lvl,buffed){
  const D=TOWERS[type],s=buffed||D.lv[lvl],out=[];
  if(s.dmg!=null)out.push(['Hasar',Math.round(s.dmg)]);
  if(s.dps!=null)out.push(['Zehir/sn',Math.round(s.dps)]);
  if(s.cd!=null)out.push(['Atış hızı',(1/s.cd).toFixed(2)+'/sn']);
  if(s.range!=null)out.push(['Menzil',s.range.toFixed(1)]);
  if(s.splash!=null&&type!=='landmine')out.push([type==='ice'?'Buz alanı':'Patlama alanı',s.splash.toFixed(2)]);
  if(s.slow!=null&&!D.trap)out.push(['Yavaşlatma','%'+Math.round(s.slow*100)]);
  if(s.freeze)out.push(['Dondurma şansı','%'+Math.round(s.freeze*100)]);
  if(s.burn)out.push(['Yanma/sn',Math.round(s.burn)]);
  if(s.spread)out.push(['Çoklu hedef',s.spread]);
  if(s.multi)out.push(['Çoklu ok',s.multi]);
  if(s.chain)out.push(['Zincir',s.chain]);
  if(s.stun)out.push(['Sersemletme',s.stun+' sn']);
  if(s.pierce)out.push(['Delme',s.pierce]);
  if(s.crit)out.push(['Kritik','%'+Math.round(s.crit*100)]);
  if(s.knock)out.push(['Geri itme',s.knock.toFixed(2)]);
  if(s.allHit)out.push(['Alan yumruğu','✔']);
  if(s.cluster)out.push(['Parça bomba',s.cluster]);
  if(s.radius!=null)out.push(['Etki alanı',s.radius.toFixed(1)]);
  if(s.cloudT)out.push(['Bulut süresi',s.cloudT+' sn']);
  if(s.weak)out.push(['Zayıflatma','+%'+Math.round(s.weak*100)]);
  if(s.slowCloud)out.push(['Bulut yavaşlatma','%'+Math.round(s.slowCloud*100)]);
  if(s.bDmg)out.push(['Hasar bonusu','+%'+Math.round(s.bDmg*100)]);
  if(s.bRange)out.push(['Menzil bonusu','+%'+Math.round(s.bRange*100)]);
  if(s.bRate)out.push(['Hız bonusu','+%'+Math.round(s.bRate*100)]);
  if(s.income)out.push(['Dalga geliri',s.income]);
  if(s.trickle)out.push(['Sürekli gelir','1 / 3 sn']);
  if(D.trap&&s.slow)out.push(['Yavaşlatma','%'+Math.round(s.slow*100)]);
  if(D.trap&&s.life)out.push(['Süre',s.life+' sn']);
  if(type==='landmine')out.push(['Patlama alanı',s.splash]);
  return out;
}
function selectTower(t,silent){if(!G)return;G.sel=t;if(t){G.place=null;G.aim=null;updateHotbarSel();if(!silent)sfx('click',true)}refreshPanel(true)}
function refreshPanel(force){
  const p=$('towerPanel'),t=G&&G.sel;
  if(!t||G.demo){p.style.display='none';UI.panelSig=null;return}
  const sig=[t.lvl,t.mode,t.stunT>0,canAfford(t.lvl<3?towerCost(t.type,t.lvl+1):0),sellValue(t),JSON.stringify(t.buff),t.detect,t.tx,t.ty].join('|');
  if(!force&&sig===UI.panelSig){const k=$('tpKills'),d=$('tpDmg');if(k)k.textContent=t.kills;if(d)d.textContent=fmt(t.dmg);return}UI.panelSig=sig;
  const D=TOWERS[t.type],next=t.lvl<3?D.lv[t.lvl+1]:null,cur=statLines(t.type,t.lvl,t.s),base=statLines(t.type,t.lvl),nx=next?statLines(t.type,t.lvl+1):null;
  let rows='';cur.forEach(([k,v],i)=>{let up='';if(nx){const n=nx.find(r=>r[0]===k);if(n&&base[i]&&String(n[1])!==String(base[i][1]))up=` <span class="up">→ ${n[1]}</span>`}rows+=`<div class="srow"><span>${k}</span><b>${v}${up}</b></div>`});
  if(nx)nx.forEach(([k,v])=>{if(!cur.find(r=>r[0]===k))rows+=`<div class="srow"><span>${k}</span><b><span class="up">yeni: ${v}</span></b></div>`});
  const b=t.buff||{};let buffs='';if(b.dmg||b.range||b.rate)buffs=`<div class="ptitle">✦ Fener: +%${Math.round((b.dmg||0)*100)} hasar${b.range?', +%'+Math.round(b.range*100)+' menzil':''}${b.rate?', +%'+Math.round(b.rate*100)+' hız':''}</div>`;
  const combat=!D.eco&&!D.support;
  const det=combat?`<div class="ptitle">${t.detect?'👁 Gizli yaratıkları görür':'<span style="color:#7a3a3a">✘ Gizlileri göremez (Sv.3 gerekir)</span>'}</div>`:'';
  const pips=[0,1,2,3].map(i=>`<i class="${i<=t.lvl?'on':''}"></i>`).join('');
  const upCost=next?towerCost(t.type,t.lvl+1):0,sv=sellValue(t);
  p.innerHTML=`<span class="close-x" data-act="close">✕</span><div class="hd"><canvas width="56" height="56" id="tpIcon"></canvas><div><div class="nm">${D.name}</div><div class="lv">Seviye ${t.lvl+1}/4${t.stunT>0?' · <span style="color:#a03030">Sersem!</span>':''}</div><div class="pips">${pips}</div></div></div>
    ${rows}${buffs}${det}
    ${combat?`<div class="srow"><span>Yok edilen</span><b id="tpKills">${t.kills}</b></div><div class="srow"><span>Toplam hasar</span><b id="tpDmg">${fmt(t.dmg)}</b></div>`:''}
    ${combat?`<div class="tmode"><span>Hedef:</span><button class="mc-btn" data-act="mode">◀ ${TARGET_MODES[t.mode]} ▶</button></div>`:''}
    <div class="tbtns">${next?`<button class="mc-btn green" data-act="up" ${canAfford(upCost)?'':'disabled'}>Yükselt (U) — ${upCost} ◆</button>`:'<button class="mc-btn" disabled>Maksimum Seviye ★</button>'}
    <button class="mc-btn red" data-act="sell">Sat (X) — +${sv}${sv===t.spent?' (tam iade)':''}</button></div>`;
  $('tpIcon').getContext('2d').drawImage(towerIcon(t.type),0,0);
  p.style.display='block';p.style.left=t.x>W/2?'10px':'auto';p.style.right=t.x>W/2?'auto':'10px';
}
$('towerPanel').addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||!G||!G.sel)return;const t=G.sel;

const TUT={select:'Hotbar\'dan bir kule seç (örn. 1 = Okçu Kulesi)',place:'Yolun yanındaki boş bir karoya tıklayarak kuleyi yerleştir',wave:'Hazır olunca ▶ Dalgayı Başlat (Boşluk tuşu)',mine:'İpucu: Ağaçlara ve cevherlere tıklayarak kaz — zümrüt kazanırsın!',done:''};
function tutorialStep(ev){if(!G||G.demo||SAVE.tutorial)return;const h=$('hint');
  if(ev==='start')G.tut='select';else if(ev==='select'&&G.tut==='select')G.tut='place';else if(ev==='built'&&(G.tut==='place'||G.tut==='select'))G.tut='wave';
  else if(ev==='wave'&&G.tut==='wave'){G.tut='mine';const gg=G;setTimeout(()=>{if(G===gg&&G.tut==='mine'){G.tut='done';SAVE.tutorial=true;saveGame();h.classList.remove('show')}},9000)}
  else if(ev==='mine'&&G.tut==='mine'){G.tut='done';SAVE.tutorial=true;saveGame()}
  const txt=TUT[G.tut]||'';h.textContent=txt;h.classList.toggle('show',!!txt)}

function startGame(mapIdx,diffKey,endless){
  initAudio();hideTip();
  document.body.classList.remove('menu');showScreen(null);
  newGame(mapIdx,diffKey,endless,false);UI.inGame=true;UI.last={map:mapIdx,diff:diffKey,endless};
  SAVE.games++;saveGame();hudCache={};UI.waveSig=null;UI.panelSig=null;
  buildHotbar();buildAbilities();updateAbilUI();updateWaveUI();updateXPUI();selectTower(null);
  $('stMap').textContent=G.map.name+' · '+G.diff.name;$('btnSpeed').textContent='1x';$('btnSpeed').classList.remove('on');$('bossbar').style.display='none';$('hint').classList.remove('show');
  MUS.boss=false;fitCanvas();
  banner(G.map.name,`<small>${G.endless?'Sonsuz Mod':G.totalWaves+' dalga'} · ${G.diff.name}</small>`);
  tutorialStep('start');
}

function gameOver(){if(G.over)return;G.over=true;sfx('defeat',true);setTimeout(()=>showEnd(false),900)}
function victory(){if(G.over)return;G.over=true;sfx('victory',true);
  const ratio=G.lives/G.maxLives,stars=ratio>=.9?3:ratio>=.5?2:1;G.stars=stars;
  if(!G.diff.creative){const id=G.map.id;SAVE.stars[id]=Math.max(SAVE.stars[id]||0,stars);SAVE.done[id]=true;
    if(G.mapIdx>=SAVE.unlocked&&G.mapIdx<MAPS.length-1){SAVE.unlocked=G.mapIdx+1;const ni=G.mapIdx+1;setTimeout(()=>toast('pix:star','Yeni Dünya Açıldı!',MAPS[ni].name),1200);
      const nt=TOWER_ORDER.filter(t=>TOWERS[t].unlock===ni);if(nt.length)setTimeout(()=>toast('t:'+nt[0],'Yeni Kuleler!',nt.map(t=>TOWERS[t].name).join(', ')),2400)}
    addXP(40*(G.mapIdx+1)*stars);
    if(G.stats.leaked===0)unlockAch('perfect');if(G.diffKey==='hard')unlockAch('hard');if(MAPS.every(m=>SAVE.done[m.id]))unlockAch('allMaps');saveGame()}

function showEnd(win){
  const s=G.stats;$('endTitle').textContent=win?'Zafer!':'Köy Düştü!';$('endTitle').style.color=win?'#7dff8f':'#ff6b6b';
  $('endStars').innerHTML=win&&!G.diff.creative?[1,2,3].map(i=>`<span class="${i<=G.stars?'on':''}">★</span>`).join(''):'';
  $('endMsg').textContent=win?(G.diff.creative?'Yaratıcı modda tamamlandı.':`${G.map.name} kurtarıldı! Kalan can: ${G.lives}/${G.maxLives}`):(G.endless?`Sonsuz modda ${G.wave}. dalgaya ulaştın. En iyi: ${SAVE.endlessBest[G.map.id]||0}`:`${G.wave}. dalgada yenildin. Tekrar dene!`);

  document.querySelectorAll('[data-diff]').forEach(b=>b.classList.toggle('on',b.dataset.diff===UI.diff));
  const endlessOk=!!SAVE.done.col||UI.diff==='creative';
  if(UI.map>SAVE.unlocked&&UI.diff!=='creative')UI.map=SAVE.unlocked;
  MAPS.forEach((m,i)=>{const lock=(i>SAVE.unlocked&&UI.diff!=='creative')||(UI.mode==='endless'&&!endlessOk);
    const c=document.createElement('div');c.className='card'+(lock?' locked':'')+(UI.map===i?' sel':'');

    c.insertAdjacentHTML('beforeend',`<div class="cn">${i+1}. ${m.name}</div><div class="cd">${m.desc}</div><div class="st">${UI.mode==='endless'?`<span style="font-size:18px;color:#ffe28a">En iyi: ${SAVE.endlessBest[m.id]||0}. dalga</span>`:[1,2,3].map(k=>`<span class="${k<=st?'on':''}">★</span>`).join('')+` <span style="font-size:17px;color:#999">${m.waves} dalga</span>`}</div>`);

function renderAch(){const grid=$('achGrid');grid.innerHTML='';const n=ACHS.filter(a=>SAVE.ach[a.id]).length;$('achInfo').textContent=`${n} / ${ACHS.length} başarım`;
  ACHS.forEach(a=>{const d=document.createElement('div');d.className='ach'+(SAVE.ach[a.id]?'':' lock');d.appendChild(iconFor(a.icon));d.insertAdjacentHTML('beforeend',`<div class="info"><div class="an">${a.name}</div><div class="ad">${a.desc}</div></div>`);grid.appendChild(d)})}
function renderBook(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.bookTab));

    <kbd>Boşluk</kbd> dalga başlat / erken çağır · <kbd>F</kbd> hız (1x/2x/3x) · <kbd>P</kbd> duraklat · <kbd>U</kbd> yükselt · <kbd>X</kbd> sat · <kbd>T</kbd> hedef modu<br>
    <kbd>Q</kbd> TNT Yağmuru · <kbd>W</kbd> Kar Fırtınası · <kbd>E</kbd> Taş Golem · <kbd>R</kbd> Altın Elma
