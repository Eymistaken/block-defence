    <h3>Kule Seviyeleri</h3>Her kule 4 seviyeye yükselir (tahta → taş → demir → elmas). 3. seviyedeki kuleler <span class="p">gizli</span> yaratıkları görebilir. Işık Feneri etrafındaki kuleleri güçlendirir.
    <h3>Gece ve Gündüz</h3>Yer üstü dünyalarında birkaç dalgada bir gece çöker: yaratıklar güçlenir, yarasalar ve gölgeler ortaya çıkar. Kuleler etraflarını aydınlatır.
    <h3>Hasar Türleri</h3><span class="gr">Fiziksel</span> zırhtan etkilenir · <span class="o">Ateş</span> zırhı deler ama ateşe bağışıklara işlemez · <span class="p">Büyü</span> zırhı tamamen yok sayar · <span class="r">Patlama</span> zırhın yarısını deler.
    <h3>Kalıcı İlerleme</h3>Yaratık öldürdükçe XP kazanır, seviye atlarsın. Her seviye <b>Büyü Masası</b>'nda harcanacak 1 puan verir. Başarımları topla, tüm dünyaları 3 yıldızla bitir!</div>`;return}
  if(UI.bookTab==='mine'){B.innerHTML='<div class="help"><h3>Madencilik</h3>Haritadaki engellere tıklayarak kazmaya başla. Kazma sırasında oyun devam eder; bitince blok kırılır, yerine kule kurabilirsin ve zümrüt kazanırsın.</div>';
    Object.entries(OBS).forEach(([k,o])=>{const c=mkCanvas(48,48),g=c.getContext('2d');g.imageSmoothingEnabled=false;drawObstacle(g,0,0,k,'plains');
      const e=document.createElement('div');e.className='entry';e.appendChild(c);e.insertAdjacentHTML('beforeend',`<div><div class="en">${o.name}</div><div class="ed">Süre: ${o.time} sn · Ödül: <span class="g">+${o.reward} zümrüt</span>${o.light?' · <span class="y">Işık yayar</span>':''}</div></div>`);B.appendChild(e)});return}
  if(UI.bookTab==='towers'){TOWER_ORDER.forEach(t=>{const D=TOWERS[t],e=document.createElement('div');e.className='entry';const c=mkCanvas(56,56);c.getContext('2d').drawImage(towerIcon(t),0,0);e.appendChild(c);
      const keys=statLines(t,D.lv.length-1).map(r=>r[0]);const rows=D.lv.map((L,i)=>{const sl=statLines(t,i);return`<tr><td>${i+1}</td><td class="g">${i?'+':''}${towerCost(t,i)}</td>${keys.map(k=>`<td>${(sl.find(r=>r[0]===k)||[0,'-'])[1]}</td>`).join('')}</tr>`}).join('');
      const lock=D.unlock>SAVE.unlocked?` <span class="r" style="font-size:18px">🔒 ${MAPS[D.unlock].name}</span>`:'';
      e.insertAdjacentHTML('beforeend',`<div><div class="en">${D.name}${lock}</div><div class="ed">${D.desc} ${D.air?'<span class="b">✔ Hava</span>':(!D.trap&&!D.eco&&!D.support?'<span class="r">✘ Hava</span>':'')}</div><table><tr><th>Sv</th><th>Bedel</th>${keys.map(k=>`<th>${k}</th>`).join('')}</tr>${rows}</table></div>`);B.appendChild(e)});return}
  Object.entries(ENEMIES).forEach(([k,d])=>{if(d.hide)return;const e=document.createElement('div');e.className='entry';const c=mkCanvas(48,48);c.getContext('2d').drawImage(enemyIcon(k),0,0);e.appendChild(c);
    e.insertAdjacentHTML('beforeend',`<div><div class="en">${d.name}</div><div class="ed">${d.desc||''}</div><div class="ed">Can: ${d.hp} · Hız: ${d.spd} · Ödül: ${d.reward} · Can kaybı: ${d.lives||1}</div><div>${enemyTags(d).map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>`);B.appendChild(e)});
}
function renderSettings(){const S=SAVE.settings;$('setMusic').value=Math.round(S.music*100);$('setSfx').value=Math.round(S.sfx*100);
  $('lblMusic').textContent='Müzik: '+Math.round(S.music*100)+'%';$('lblSfx').textContent='Ses Efektleri: '+Math.round(S.sfx*100)+'%';
  const onf=v=>v?'AÇIK':'KAPALI';$('setDmg').textContent='Hasar Sayıları: '+onf(S.dmgNums);$('setShake').textContent='Ekran Sarsıntısı: '+onf(S.shake);
  $('setPart').textContent='Parçacıklar: '+(S.particles==='high'?'YÜKSEK':'DÜŞÜK');$('setAuto').textContent='Otomatik Dalga: '+onf(S.autoWave);$('setRanges').textContent='Tüm Menziller: '+onf(S.showRanges);
  if(!UI.wipe)$('setWipe').textContent='Tüm Verileri Sil'}

/* ---------- buton bağlantıları ---------- */
const on=(id,f)=>$(id).addEventListener('click',e=>{initAudio();sfx('click',true);f(e)});
on('mPlay',()=>{renderLevels();showScreen('scrLevels')});
on('mPerks',()=>{renderPerks();showScreen('scrPerks')});
on('mAch',()=>{renderAch();showScreen('scrAch')});
on('mBook',()=>{UI.fromPause=false;renderBook();showScreen('scrBook')});
on('mSettings',()=>{UI.fromPause=false;UI.wipe=0;renderSettings();showScreen('scrSettings')});
on('lvBack',()=>showScreen('scrMenu'));on('pkBack',()=>showScreen('scrMenu'));on('acBack',()=>showScreen('scrMenu'));
on('bkBack',()=>showScreen(UI.fromPause?'scrPause':'scrMenu'));on('stBack',()=>showScreen(UI.fromPause?'scrPause':'scrMenu'));
on('lvStart',()=>startGame(UI.map,UI.diff,UI.mode==='endless'));
on('pkReset',()=>{SAVE.perks={};saveGame();renderPerks()});
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{UI.mode=b.dataset.mode;sfx('click',true);renderLevels()}));
document.querySelectorAll('[data-diff]').forEach(b=>b.addEventListener('click',()=>{UI.diff=b.dataset.diff;sfx('click',true);renderLevels()}));
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{UI.bookTab=b.dataset.tab;sfx('click',true);renderBook()}));
$('setMusic').addEventListener('input',e=>{SAVE.settings.music=e.target.value/100;applyVolumes();saveGame();renderSettings()});
$('setSfx').addEventListener('input',e=>{SAVE.settings.sfx=e.target.value/100;applyVolumes();saveGame();renderSettings()});
on('setDmg',()=>{SAVE.settings.dmgNums=!SAVE.settings.dmgNums;saveGame();renderSettings()});
on('setShake',()=>{SAVE.settings.shake=!SAVE.settings.shake;saveGame();renderSettings()});
on('setPart',()=>{SAVE.settings.particles=SAVE.settings.particles==='high'?'low':'high';saveGame();renderSettings()});
on('setAuto',()=>{SAVE.settings.autoWave=!SAVE.settings.autoWave;saveGame();renderSettings()});
on('setRanges',()=>{SAVE.settings.showRanges=!SAVE.settings.showRanges;saveGame();renderSettings()});
on('setWipe',()=>{if(!UI.wipe){UI.wipe=1;$('setWipe').textContent='Emin misin? Tekrar tıkla';return}const st=SAVE.settings;SAVE=defaultSave();SAVE.settings=st;saveGame();updateXPUI();UI.wipe=2;$('setWipe').textContent='Veriler silindi'});
on('psResume',()=>togglePause(false));
on('psSettings',()=>{UI.fromPause=true;UI.wipe=0;renderSettings();showScreen('scrSettings')});
on('psBook',()=>{UI.fromPause=true;renderBook();showScreen('scrBook')});
on('psRestart',()=>{const L=UI.last;startGame(L.map,L.diff,L.endless)});
on('psQuit',()=>{startDemo();showScreen('scrMenu')});
on('enAgain',()=>{const L=UI.last;startGame(L.map,L.diff,L.endless)});
on('enNext',()=>{const L=UI.last;UI.map=L.map+1;startGame(L.map+1,L.diff,false)});
on('enMenu',()=>{startDemo();renderLevels();showScreen('scrLevels')});
on('btnPause',()=>togglePause());
on('btnSpeed',()=>toggleSpeed());
$('btnWave').addEventListener('click',()=>{initAudio();if(G&&!G.demo&&!G.over&&!G.paused)startNextWave()});

/* ---------- giriş ---------- */
function toCanvas(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.addEventListener('pointermove',e=>{if(!G)return;const p=toCanvas(e);G.mouse={x:p.x,y:p.y,in:true};G.hover={tx:Math.floor(p.x/TILE),ty:Math.floor(p.y/TILE)};hoverTip(e,p)});
canvas.addEventListener('pointerleave',()=>{if(G){G.mouse.in=false;hideTip()}});
canvas.addEventListener('contextmenu',e=>{e.preventDefault();if(G&&!G.demo){G.place=null;G.aim=null;selectTower(null);updateHotbarSel();updateAbilUI()}});
canvas.addEventListener('pointerdown',e=>{
  initAudio();if(!G||G.demo||G.over||G.paused)return;if(e.button===2)return;
  const p=toCanvas(e),tx=Math.floor(p.x/TILE),ty=Math.floor(p.y/TILE);G.mouse={x:p.x,y:p.y,in:true};G.hover={tx,ty};
  if(G.aim){useAbility(G.aim,p.x,p.y);updateAbilUI();return}
  if(G.place){if(buildTower(G.place,tx,ty)&&!e.shiftKey){G.place=null;updateHotbarSel()}updateHotbar();return}
  const c=cell(tx,ty);if(!c)return;
  if(c.tower){selectTower(c.tower);return}
  if(c.obs){startMining(tx,ty);selectTower(null);return}
  selectTower(null);
});
function hoverTip(e,p){
  if(G.demo||G.place||G.aim){hideTip();return}
  let en=null,bd=20*20;for(const ee of G.enemies){if(ee.def.camo)continue;const yy=(enemyTopY(ee)+ee.y+8)/2,dd=d2(p.x,p.y,ee.x,yy);if(dd<bd){bd=dd;en=ee}}
  if(en){const d=en.def;showTip(`<div class="t">${d.name}</div><div>❤ ${Math.ceil(en.hp)} / ${Math.round(en.maxHp)}</div><div>${enemyTags(d).join(' · ')}</div>`,e.clientX,e.clientY);return}
  const c=cell(G.hover.tx,G.hover.ty);
  if(c&&c.obs){const O=OBS[c.obs];showTip(`<div class="t">${O.name}</div><div class="g">Kaz: +${Math.round(O.reward*(1+perk('mining')*.15))} zümrüt</div><div class="gr">Süre: ${(O.time*(1-perk('mining')*.12)).toFixed(1)} sn · Tıkla ve kaz</div>`,e.clientX,e.clientY);return}
  hideTip();
}
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;initAudio();
  const k=e.key;
  if(k==='Escape'){if(!G||G.demo){if(!$('scrMenu').classList.contains('show'))showScreen('scrMenu');return}
    if(G.over)return;
    if(G.place||G.aim||G.sel){G.place=null;G.aim=null;selectTower(null);updateHotbarSel();updateAbilUI();return}
    if($('scrSettings').classList.contains('show')||$('scrBook').classList.contains('show')){showScreen('scrPause');return}
    togglePause();return}
  if(!G||G.demo||G.over)return;
  if(k==='p'||k==='P'){togglePause();return}
  if(G.paused)return;
  const hi=HOTKEYS.indexOf(k);if(hi>=0){selectPlace(TOWER_ORDER[hi]);e.preventDefault();return}
  const lk=k.toLowerCase();
  if(k===' '){e.preventDefault();startNextWave();return}
  if(lk==='f'){toggleSpeed();return}
  if(lk==='u'&&G.sel){upgradeTower(G.sel);return}
  if((lk==='x'||k==='Delete')&&G.sel){sellTower(G.sel);return}
  if(lk==='t'&&G.sel){G.sel.mode=(G.sel.mode+1)%TARGET_MODES.length;refreshPanel(true);return}
  const ai=['q','w','e','r'].indexOf(lk);if(ai>=0){const id=ABIL[ai].id;if(G.aim===id&&G.mouse.in)useAbility(id,G.mouse.x,G.mouse.y);else useAbility(id);updateAbilUI();return}
});
document.addEventListener('pointerdown',()=>initAudio());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.demo&&!G.over&&!G.paused)togglePause(true)});

/* ---------- boyutlandırma ---------- */
function fitCanvas(){const r=$('stage').getBoundingClientRect();const s=Math.max(.1,Math.min(r.width/W,r.height/H));canvas.style.width=Math.floor(W*s)+'px';canvas.style.height=Math.floor(H*s)+'px'}
window.addEventListener('resize',fitCanvas);
if(window.ResizeObserver)new ResizeObserver(fitCanvas).observe($('stage'));

/* ---------- ana döngü ---------- */
let lastT=performance.now(),acc=0,uiT=0;const STEP=1/60;
function frame(now){
  const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  try{
    if(G&&!G.paused&&!(G.over&&!G.demo)){acc+=dt*G.speed;let n=0;while(acc>=STEP&&n<10){update(STEP);acc-=STEP;n++}if(n>=10)acc=0}
    else if(G&&G.over)updateParts(dt);
    if(G)render();
    uiT-=dt;if(uiT<=0&&G&&!G.demo){uiT=.15;updateHUD();updateHotbar();updateAbilUI();refreshPanel(false);updateWaveUI()}
  }catch(err){console.error(err)}
  requestAnimationFrame(frame);
}

/* ---------- açılış ---------- */
loadSave();buildTextures();setupStatic();updateXPUI();
startDemo();showScreen('scrMenu');
setInterval(()=>{if(!UI.inGame)$('splash').textContent=pick(SPLASHES)},12000);
requestAnimationFrame(frame);

</script>
